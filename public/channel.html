<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳 - Channel Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f23;
      --card: #1a1a2e;
      --accent: #00d9ff;
      --text: #e0e0e0;
      --muted: #888;
      --green: #4ade80;
      --red: #f87171;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }
    .channel-id {
      background: var(--card);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--muted);
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #2a2a4a;
    }
    
    .balance {
      font-size: 3rem;
      text-align: center;
      font-weight: bold;
    }
    .balance.positive { color: var(--green); }
    .balance.negative { color: var(--red); }
    
    .balance-label {
      text-align: center;
      color: var(--muted);
      margin-bottom: 10px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    .stat {
      background: #0d0d1a;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .stat-value.income { color: var(--green); }
    .stat-value.expense { color: var(--red); }
    .stat-label { color: var(--muted); font-size: 0.9rem; }
    
    .transactions { list-style: none; }
    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a4a;
      gap: 10px;
    }
    .transaction:last-child { border-bottom: none; }
    
    .t-info { flex: 1; }
    .t-category {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #dff4ff;
      border: 1px solid #2a2a4a;
    }
    .t-note { color: var(--text); margin-top: 4px; }
    .t-time { color: var(--muted); font-size: 0.8rem; }
    
    .t-amount {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .t-amount.income { color: var(--green); }
    .t-amount.expense { color: var(--red); }

    .t-actions {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .tx-menu { position: relative; }
    .tx-menu summary { list-style: none; user-select: none; }
    .tx-menu summary::-webkit-details-marker { display: none; }
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
    }
    .tx-menu-panel {
      position: absolute;
      right: 0;
      top: 36px;
      min-width: 110px;
      background: #111827;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .tx-menu-panel button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tx-menu-panel button:hover { background: #1f2937; }
    .tx-menu-panel button.danger { color: #fca5a5; }

    .btn {
      border: 1px solid #2a2a4a;
      background: #121226;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-danger:hover { border-color: var(--red); color: var(--red); }
    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .btn.loading {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(0, 217, 255, 0.25) inset;
    }
    .btn-save-primary {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-color: #22c55e;
      color: #f0fdf4;
      font-weight: 700;
    }
    .btn-save-primary:hover {
      border-color: #4ade80;
      box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35) inset;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { color: var(--muted); font-size: 0.85rem; }
    .form-field input, .form-field textarea, .form-field select {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
    }
    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status-text {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      background: #111326;
      font-weight: 600;
      display: none;
    }
    .status-text.show { display: block; }
    .status-text.error {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.55);
      background: rgba(127, 29, 29, 0.3);
    }
    .status-text.success {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(20, 83, 45, 0.3);
    }
    .status-text.pending {
      color: #bae6fd;
      border-color: rgba(0, 217, 255, 0.55);
      background: rgba(8, 47, 73, 0.35);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .settings-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-panel { display: none; }
    .settings-panel.open { display: block; }

    .toast {
      position: fixed;
      right: 20px;
      top: 20px;
      z-index: 9999;
      min-width: 220px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      background: #111326;
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.success {
      border-color: rgba(74, 222, 128, 0.65);
      background: rgba(20, 83, 45, 0.95);
      color: #dcfce7;
    }
    .toast.error {
      border-color: rgba(248, 113, 113, 0.65);
      background: rgba(127, 29, 29, 0.95);
      color: #fee2e2;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2a2a4a;
      background: #101022;
      color: var(--text);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.82rem;
    }
    .chip button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
    }
    .chip button:hover { color: var(--red); }

    .chip-add-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .chip-add-row input { flex: 1; }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .recurring-list {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }
    .recurring-row {
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px;
      background: #101022;
      display: grid;
      grid-template-columns: minmax(140px, 2fr) repeat(3, minmax(90px, 1fr)) auto;
      gap: 8px;
      align-items: center;
    }
    .recurring-row > * {
      min-width: 0;
    }
    .recurring-row input,
    .recurring-row select {
      width: 100%;
    }
    .recurring-row .btn {
      white-space: nowrap;
      padding: 8px 10px;
    }
    .recurring-row .row-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      grid-column: 1 / -1;
    }

    .month-select-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .month-filter-card {
      background: linear-gradient(160deg, #1a1a2e 0%, #16162a 100%);
      border-color: #31315a;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .month-filter-row {
      align-items: flex-start;
      gap: 12px;
    }
    .month-picker-wrap {
      gap: 10px;
    }
    .month-picker {
      position: relative;
      min-width: 112px;
    }
    .month-picker span {
      display: block;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }
    .month-picker select {
      appearance: none;
      width: 100%;
      background: #0f1329;
      border: 1px solid #334155;
      color: #dbeafe;
      border-radius: 999px;
      padding: 8px 34px 8px 12px;
      font-size: 0.9rem;
      line-height: 1.2;
    }
    .month-picker::after {
      content: '▾';
      position: absolute;
      right: 12px;
      bottom: 8px;
      color: #93c5fd;
      pointer-events: none;
      font-size: 0.8rem;
    }
    .month-picker select:hover,
    .month-picker select:focus {
      border-color: #38bdf8;
      outline: none;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }
    .month-global-label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .section-hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .budget-progress-wrap {
      margin-top: 14px;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px;
    }
    .budget-progress-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 8px;
    }
    .budget-progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #1f2937;
      overflow: hidden;
    }
    .budget-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      width: 0%;
      transition: width 0.2s ease;
    }
    .budget-progress-meta {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-budget-list {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .category-budget-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .category-budget-item .name {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-track {
      height: 6px;
      border-radius: 999px;
      background: #1f2937;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      border-radius: 999px;
    }
    .category-budget-editor {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .category-budget-row {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 8px;
      align-items: center;
    }
    .category-budget-row .name {
      font-size: 0.88rem;
      color: var(--text);
    }

    .segmented {
      display: inline-flex;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      overflow: hidden;
      background: #0d0d1a;
    }
    .segmented button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .segmented button.active {
      color: var(--text);
      background: #1b1b34;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    
    .error {
      background: #3a1a1a;
      border: 1px solid var(--red);
      padding: 16px;
      border-radius: 8px;
      color: var(--red);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #111827;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px;
    }

    .group-header {
      background: #121226;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    canvas {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
      }
      .channel-id {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
      }
      .balance { font-size: 2.2rem; }
      .stats { grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .toggle-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .month-select-row {
        width: 100%;
      }
      .month-filter-row {
        gap: 10px;
      }
      .month-picker-wrap {
        width: 100%;
      }
      .month-picker {
        flex: 1;
        min-width: 0;
      }
      .month-select-row select {
        flex: 1;
        min-width: 0;
      }
      .segmented {
        width: 100%;
      }
      .segmented button {
        flex: 1;
      }
      .transaction {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .t-amount {
        align-self: flex-end;
      }
      .t-actions {
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .chip-add-row,
      .actions-row {
        flex-direction: column;
        align-items: stretch;
      }
      .recurring-row {
        grid-template-columns: 1fr;
      }
      .recurring-row .row-inline {
        grid-template-columns: 1fr;
      }
      .actions-row .btn {
        width: 100%;
      }
      .category-budget-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .category-budget-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .balance { font-size: 1.8rem; }
      .stat-value { font-size: 1.25rem; }
      .btn { font-size: 0.8rem; }
      .form-field input, .form-field textarea, .form-field select {
        font-size: 0.9rem;
      }
    }
    .page-credit {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 16px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="dashboardTitle">🦑 記帳 Dashboard</h1>
      <span class="channel-id" id="channelId">載入中...</span>
    </header>
    
    <div id="app">
      <div class="loading">載入中...</div>
    </div>
    <div class="page-credit">Powered by CBC0210 · Accounting Bot Dashboard</div>
  </div>
  <div id="saveToast" class="toast" aria-live="polite"></div>
  <div id="txEditModal" class="modal-backdrop" onclick="onModalBackdropClick(event)">
    <div class="modal-card">
      <div class="toggle-row" style="margin-bottom: 12px;">
        <h2 style="margin:0;">✏️ 編輯條目</h2>
        <button class="btn" onclick="closeEditModal()">關閉</button>
      </div>
      <div class="form-grid" style="margin-top:0;">
        <div class="form-field">
          <label>金額</label>
          <input id="editAmount" type="text" inputmode="numeric" placeholder="例如 135" />
        </div>
        <div class="form-field">
          <label>類型</label>
          <select id="editType" onchange="onEditTypeChange()">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div class="form-field">
          <label>日期</label>
          <input id="editDate" type="date" />
        </div>
        <div class="form-field">
          <label>時間</label>
          <input id="editTime" type="time" />
        </div>
        <div class="form-field">
          <label>類別</label>
          <select id="editCategory"></select>
        </div>
        <div class="form-field full">
          <label>備註</label>
          <input id="editNote" type="text" placeholder="可留空" />
        </div>
      </div>
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn" onclick="submitEditTransaction()">儲存修改</button>
      </div>
      <div id="editTxStatus" class="status-text"></div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const channelId = window.location.pathname.replace('/', '');
    document.getElementById('channelId').textContent = channelId;

    const defaultCategoryTags = [
      '餐飲', '交通', '購物', '娛樂', '房租/帳單', '住宿', '日常生活', '醫療', '教育', '投資', '禮物', '其他',
      '薪資', '兼職', '被動收入', '紅包', '生活費'
    ];
    const defaultIncomeCategoryTags = ['薪資', '兼職', '被動收入', '紅包', '生活費', '收入'];
    const defaultStyleTags = ['友善', '幽默', '精簡'];
    const defaultMealPeriods = {
      breakfast: { start: '05:00', end: '10:59' },
      lunch: { start: '11:00', end: '15:59' },
      dinner: { start: '16:00', end: '21:59' },
      late_night: { start: '22:00', end: '04:59' },
    };
    let settingsPanelOpen = false;
    let expenseCategoryTags = [];
    let incomeCategoryTags = [];
    let styleTags = [];
    let recurringRows = [];
    let chartExpense = null;
    let chartIncome = null;
    let listMode = 'by_date';
    let selectedMonth = '';
    let currentMonthTransactions = [];
    let editingTransactionId = null;
    let categoryBudgets = {};
    let mealPeriods = { ...defaultMealPeriods };

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function dedupeTags(tags) {
      const seen = new Set();
      return tags
        .map((t) => String(t || '').trim())
        .filter(Boolean)
        .filter((t) => {
          const key = t.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function parseTagsFromSettingsText(text, fallback) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
      const tags = [];
      lines.forEach((line) => {
        if (line.includes('：')) {
          const parts = line.split('：');
          const listText = parts.slice(1).join('：');
          listText.split(/[、,，]/).forEach((token) => tags.push(token.trim()));
        } else {
          line.split(/[、,，]/).forEach((token) => tags.push(token.trim()));
        }
      });
      const cleaned = dedupeTags(tags);
      return cleaned.length ? cleaned : [...fallback];
    }

    function isIncomeCategoryTag(tag) {
      const text = String(tag || '').trim().toLowerCase();
      if (!text) return false;
      return defaultIncomeCategoryTags.some((x) => String(x).toLowerCase() === text);
    }

    function splitCategoryTagsByType(tags) {
      const source = dedupeTags(tags || []);
      const income = [];
      const expense = [];
      source.forEach((tag) => {
        if (isIncomeCategoryTag(tag)) {
          income.push(tag);
        } else {
          expense.push(tag);
        }
      });
      return {
        expense: dedupeTags(expense),
        income: dedupeTags(income),
      };
    }

    function parseCategoryBudgetsText(text) {
      if (!text) return {};
      try {
        const parsed = JSON.parse(String(text || '{}'));
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
        const out = {};
        Object.entries(parsed).forEach(([k, v]) => {
          const key = String(k || '').trim();
          const amount = Number(v);
          if (!key || !Number.isFinite(amount) || amount <= 0) return;
          out[key] = Math.round(amount);
        });
        return out;
      } catch (_) {
        return {};
      }
    }

    function serializeCategoryBudgets(mapObj) {
      const out = {};
      Object.entries(mapObj || {}).forEach(([k, v]) => {
        const key = String(k || '').trim();
        const amount = Number(v);
        if (!key || !Number.isFinite(amount) || amount <= 0) return;
        out[key] = Math.round(amount);
      });
      return JSON.stringify(out);
    }

    function parseMealPeriodsText(text) {
      if (!text) return { ...defaultMealPeriods };
      try {
        const parsed = JSON.parse(String(text || '{}'));
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return { ...defaultMealPeriods };
        const out = {};
        Object.keys(defaultMealPeriods).forEach((key) => {
          const src = parsed[key] || defaultMealPeriods[key];
          const start = String(src?.start || '').trim();
          const end = String(src?.end || '').trim();
          out[key] = {
            start: /^([01]\d|2[0-3]):([0-5]\d)$/.test(start) ? start : defaultMealPeriods[key].start,
            end: /^([01]\d|2[0-3]):([0-5]\d)$/.test(end) ? end : defaultMealPeriods[key].end,
          };
        });
        return out;
      } catch (_) {
        return { ...defaultMealPeriods };
      }
    }

    function serializeMealPeriods(periods) {
      const out = {};
      Object.keys(defaultMealPeriods).forEach((key) => {
        const start = String(periods?.[key]?.start || defaultMealPeriods[key].start).trim();
        const end = String(periods?.[key]?.end || defaultMealPeriods[key].end).trim();
        out[key] = { start, end };
      });
      return JSON.stringify(out);
    }

    function getMonthParts(monthText) {
      const match = String(monthText || '').match(/^(\d{4})-(\d{2})$/);

    function buildYearOptions(selectedYear) {
      const currentYear = new Date().getFullYear();
      const years = [];
      for (let y = currentYear - 5; y <= currentYear; y += 1) years.push(y);
      const selected = Number(selectedYear);
      if (Number.isFinite(selected) && !years.includes(selected)) years.push(selected);
      years.sort((a, b) => a - b);
      return years
        .map((y) => `<option value="${y}" ${Number(selectedYear) === y ? 'selected' : ''}>${y}年</option>`)
        .join('');
    }

    function buildMonthOptions(selectedMonthNum) {
      const monthNum = Number(selectedMonthNum);
      const months = Array.from({ length: 12 }, (_, i) => i + 1);
      return months
        .map((m) => `<option value="${m}" ${monthNum === m ? 'selected' : ''}>${m}月</option>`)
        .join('');
    }

    function createEmptyRecurringRow() {
      return {
        name: '',
        amount: '',
        scheduleType: 'monthly',
        day: '1',
        weekday: '一',
        time: '09:00',
        type: 'expense',
      };
    }

    function parseRecurringRowsText(text) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);

      const rows = lines.map((line) => {
        const parts = line.split(/[,\uFF0C]/).map((v) => v.trim());
        if (parts.length < 4) return null;
        const name = parts[0];
        const amount = String(Number(parts[1]) || '');
        const schedule = parts[2];
        const type = parts[3] === 'income' ? 'income' : 'expense';
        let scheduleType = 'monthly';
        let day = '1';
        let weekday = '一';
        let time = '09:00';

        let m = schedule.match(/^每月(\d{1,2})號?(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'monthly';
          day = m[1];
          if (m[2]) time = m[2];
          return { name, amount, scheduleType, day, weekday, time, type };
        }

        m = schedule.match(/^每週([一二三四五六日天])(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'weekly';
          weekday = m[1] === '天' ? '日' : m[1];
          if (m[2]) time = m[2];
          return { name, amount, scheduleType, day, weekday, time, type };
        }

        m = schedule.match(/^每日(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'daily';
          if (m[1]) time = m[1];
          return { name, amount, scheduleType, day, weekday, time, type };
        }

        return { name, amount, scheduleType, day, weekday, time, type };
      }).filter(Boolean);

      return rows.length ? rows : [createEmptyRecurringRow()];
    }

    function recurringRowsToText(rows) {
      return rows
        .map((row) => {
          const name = String(row.name || '').trim();
          const amount = Number(String(row.amount || '').trim());
          const time = String(row.time || '').trim();
          if (!name || !Number.isFinite(amount) || amount <= 0 || !isValidTime(time)) return null;

          let schedule = `每月${Number(row.day || 1)}號 ${time}`;
          if (row.scheduleType === 'weekly') {
            schedule = `每週${row.weekday || '一'} ${time}`;
          } else if (row.scheduleType === 'daily') {
            schedule = `每日 ${time}`;
          }
          return `${name},${Math.round(amount)},${schedule},${row.type === 'income' ? 'income' : 'expense'}`;
        })
        .filter(Boolean)
        .join('\n');
    }

    function renderRecurringRows() {
      return recurringRows.map((row, idx) => `
        <div class="recurring-row">
          <input type="text" placeholder="名稱（例：房租）" value="${escapeHtml(row.name)}" onchange="updateRecurringRow(${idx}, 'name', this.value)" />

            <option value="weekly" ${row.scheduleType === 'weekly' ? 'selected' : ''}>每週</option>
            <option value="daily" ${row.scheduleType === 'daily' ? 'selected' : ''}>每日</option>
          </select>
          <select onchange="updateRecurringRow(${idx}, 'type', this.value)">
            <option value="expense" ${row.type === 'expense' ? 'selected' : ''}>支出</option>

          <div class="row-inline">
            ${row.scheduleType === 'monthly'
              ? `<input type="text" inputmode="numeric" placeholder="每月幾號" value="${escapeHtml(row.day)}" onchange="updateRecurringRow(${idx}, 'day', this.value)" />`
              : row.scheduleType === 'weekly'
                ? `<select onchange="updateRecurringRow(${idx}, 'weekday', this.value)">
                    ${['一','二','三','四','五','六','日'].map((d) => `<option value="${d}" ${row.weekday === d ? 'selected' : ''}>週${d}</option>`).join('')}
                  </select>`
                : `<div class="status-text">每日固定執行</div>`}
            <input type="text" placeholder="時間 HH:mm" value="${escapeHtml(row.time)}" onchange="updateRecurringRow(${idx}, 'time', this.value)" />
          </div>
        </div>
      `).join('');
    }

      try {
        if (!selectedMonth) selectedMonth = getDefaultMonthText();
        const monthParts = getMonthParts(selectedMonth) || getMonthParts(getDefaultMonthText());
        const [channelRes, settingsRes, analyticsRes, monthTxRes, settlementRes] = await Promise.all([
          fetch(`/api/channel/${channelId}`),
          fetch(`/api/channel/${channelId}/settings`),
          fetch(`/api/channel/${channelId}/analytics/month?year=${monthParts.year}&month=${monthParts.month}`),
          fetch(`/api/channel/${channelId}/transactions?year=${monthParts.year}&month=${monthParts.month}`),
          fetch(`/api/channel/${channelId}/settlements?limit=12`),
        ]);
        const data = await channelRes.json();
        const settings = await settingsRes.json();
        const analytics = await analyticsRes.json();
        const monthTxPayload = await monthTxRes.json();
        const settlementPayload = await settlementRes.json();
        const monthTransactions = Array.isArray(monthTxPayload.transactions) ? monthTxPayload.transactions : [];
        const settlements = Array.isArray(settlementPayload.settlements) ? settlementPayload.settlements : [];
        const currentMonthSettlement = settlements.find(
          (row) => Number(row.year) === Number(monthParts.year) && Number(row.month) === Number(monthParts.month)
        );
        const filteredSettlements = currentMonthSettlement ? [currentMonthSettlement] : [];
        currentMonthTransactions = monthTransactions;

          document.getElementById('app').innerHTML = `<div class="error">錯誤: ${escapeHtml(data.error)}</div>`;
          return;

    function removeExpenseCategoryTag(tag) {

    function rerenderRecurringRows() {
      const el = document.getElementById('recurringRows');
      if (!el) return;
      el.innerHTML = renderRecurringRows();
    }

    function addRecurringRow() {
      recurringRows = [...recurringRows, createEmptyRecurringRow()];
      rerenderRecurringRows();
    }

    function removeRecurringRow(index) {
      recurringRows = recurringRows.filter((_, idx) => idx !== index);
      if (!recurringRows.length) recurringRows = [createEmptyRecurringRow()];
      rerenderRecurringRows();
    }

    function updateRecurringRow(index, field, value) {
      recurringRows = recurringRows.map((row, idx) => (
        idx === index ? { ...row, [field]: String(value || '').trim() } : row
      ));
    }

    function updateCategoryBudgetValue(encodedTag, value) {
      const tag = decodeURIComponent(encodedTag || '');
      const text = String(value || '').trim().replace(/[,\s]/g, '');
      if (!tag) return;
      if (!text) {
        delete categoryBudgets[tag];
        return;
      }
      const amount = Number(text);
      if (!Number.isFinite(amount) || amount < 0) {
        return;
      }
      if (amount === 0) {
        delete categoryBudgets[tag];
        return;
      }
      categoryBudgets[tag] = Math.round(amount);
    }

    function parseBudgetInput(text) {
      const normalized = String(text || '').replace(/[,\s]/g, '');
      if (!/^\d+$/.test(normalized)) return null;
      const value = Number(normalized);
      if (!Number.isFinite(value) || value < 0) return null;
      return Math.round(value);
    }

    function isValidTime(text) {
      return /^([01]?\d|2[0-3]):([0-5]\d)$/.test(String(text || '').trim());
    }

    function readMealPeriodsFromInputs() {
      const periods = {
        breakfast: {
          start: String(document.getElementById('mealBreakfastStart')?.value || '').trim(),
          end: String(document.getElementById('mealBreakfastEnd')?.value || '').trim(),
        },
        lunch: {
          start: String(document.getElementById('mealLunchStart')?.value || '').trim(),
          end: String(document.getElementById('mealLunchEnd')?.value || '').trim(),
        },
        dinner: {
          start: String(document.getElementById('mealDinnerStart')?.value || '').trim(),
          end: String(document.getElementById('mealDinnerEnd')?.value || '').trim(),
        },
        late_night: {
          start: String(document.getElementById('mealLateNightStart')?.value || '').trim(),
          end: String(document.getElementById('mealLateNightEnd')?.value || '').trim(),
        },
      };

      const labels = {
        breakfast: '早餐',
        lunch: '午餐',
        dinner: '晚餐',
        late_night: '宵夜',
      };
      for (const key of Object.keys(periods)) {
        const start = periods[key].start;
        const end = periods[key].end;
        if (!isValidTime(start) || !isValidTime(end)) {
          return { error: `${labels[key]}時段格式錯誤，請使用 HH:mm` };
        }
      }
      return { value: periods };
    }

    async function saveSettings() {
      const budgetRaw = String(document.getElementById('budgetInput').value || '').trim();
      const budgetValue = parseBudgetInput(budgetRaw);
      if (budgetValue === null) {
        setStatus('預算格式錯誤：請輸入 0 或正整數（例如 42000）', true);
        return;
      }

      const reminderTime = document.getElementById('reminderTimeInput').value.trim();
      if (reminderTime && !isValidTime(reminderTime)) {
        setStatus('提醒時間格式錯誤：請使用 HH:mm（例如 21:30）', true);
        return;
      }

      const currencyValue = document.getElementById('currencyInput').value.trim() || 'TWD';
      if (!/^[A-Za-z]{2,6}$/.test(currencyValue)) {
        setStatus('貨幣格式錯誤：請輸入 2-6 位英文字母（例如 TWD）', true);
        return;
      }

      const mealPeriodsResult = readMealPeriodsFromInputs();
      if (mealPeriodsResult.error) {
        setStatus(mealPeriodsResult.error, true);
        return;
      }

      const payload = {
        budget: budgetValue,
        reminderTime,
        gender: document.getElementById('genderInput').value,
        title: document.getElementById('titleInput').value.trim(),
        currency: currencyValue.toUpperCase(),
        showBalanceInName: document.getElementById('showBalanceInNameInput').value === 'true',
        vehicleSyncEnabled: document.getElementById('vehicleSyncInput').value === 'true',
        categoriesText: dedupeTags(getAllCategoryTags()).join('\n'),
        categoryBudgetsText: serializeCategoryBudgets(categoryBudgets),
        mealPeriodsText: serializeMealPeriods(mealPeriodsResult.value),
        chatStyleTagsText: dedupeTags(styleTags).join('\n'),
        recurringItemsText: recurringRowsToText(recurringRows),
      };
      const categoryBudgetTotal = Object.values(categoryBudgets || {}).reduce((sum, v) => sum + Number(v || 0), 0);
      if (categoryBudgetTotal > budgetValue) {
        setStatus(`分類預算總和（${categoryBudgetTotal.toLocaleString()}）不可超過每月預算（${budgetValue.toLocaleString()}）`, true);
        return;
      }
      setSaveButtonsLoading(true);
      setStatus('⏳ 設定儲存中，請稍候…', false, 'pending');
      try {
        const res = await fetch(`/api/channel/${channelId}/settings`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '儲存失敗');
        settingsPanelOpen = false;
        await loadData();
        setStatus('✅ 設定已儲存', false, 'success');
        showSaveToast('✅ 設定已儲存', 'success');
      } catch (error) {
        setStatus(`儲存失敗：${error.message}`, true);
        showSaveToast(`❌ 儲存失敗：${error.message}`, 'error');
      } finally {
        setSaveButtonsLoading(false);
      }
    }

    function exportData(format) {
      window.location.href = `/api/channel/${channelId}/export?format=${encodeURIComponent(format)}`;
    }

    async function importData() {
      const fileInput = document.getElementById('importFileInput');
      const modeInput = document.getElementById('importModeInput');
      const file = fileInput?.files?.[0];
      if (!file) {
        setStatus('請先選擇要匯入的檔案');
        return;
      }
      const lower = file.name.toLowerCase();
      const format = lower.endsWith('.csv') ? 'csv' : 'json';
      try {
        setStatus('匯入中...');
        const text = await file.text();
        const res = await fetch(`/api/channel/${channelId}/import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            format,
            mode: modeInput?.value || 'append',
            data: text,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '匯入失敗');
        setStatus(`匯入完成，共 ${data.importedCount || 0} 筆`);
        await loadData();
      } catch (error) {
        setStatus(`匯入失敗：${error.message}`);
      }
    }

    function findTransactionById(id) {
      return (currentMonthTransactions || []).find((item) => Number(item.id) === Number(id)) || null;
    }

    function toDateInputValue(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return '';
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function toTimeInputValue(timestamp) {
      if (!timestamp) return '00:00';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return '00:00';
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function formatDateTimeText(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return String(timestamp);
      const date = d.toLocaleDateString('zh-TW');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${date} ${hh}:${mm}`;
    }

    function openEditTransaction(id) {
      const tx = findTransactionById(id);
      if (!tx) {
        alert('找不到該筆交易，請重整後再試');
        return;
      }
      editingTransactionId = Number(id);
      document.getElementById('editAmount').value = String(Number(tx.amount || 0));
      document.getElementById('editType').value = tx.type === 'income' ? 'income' : 'expense';
      renderEditCategoryOptions(String(tx.category || ''), tx.type === 'income' ? 'income' : 'expense');
      document.getElementById('editDate').value = toDateInputValue(tx.timestamp) || toDateInputValue(new Date().toISOString());
      document.getElementById('editTime').value = toTimeInputValue(tx.timestamp);
      document.getElementById('editNote').value = String(tx.note || '');
      document.getElementById('editTxStatus').textContent = '';
      document.getElementById('txEditModal').classList.add('open');
    }

    function closeEditModal() {
      editingTransactionId = null;
      document.getElementById('txEditModal').classList.remove('open');
    }

    function onModalBackdropClick(event) {
      if (event.target && event.target.id === 'txEditModal') closeEditModal();
    }

    async function submitEditTransaction() {
      if (!editingTransactionId) return;
      const amountText = String(document.getElementById('editAmount').value || '').trim().replace(/[,\s]/g, '');
      const amountValue = Number(amountText);
      if (!Number.isFinite(amountValue) || amountValue <= 0) {
        document.getElementById('editTxStatus').textContent = '金額格式錯誤，請輸入正數';
        return;
      }
      const category = String(document.getElementById('editCategory').value || '').trim() || '未分類';
      const note = String(document.getElementById('editNote').value || '').trim();
      const type = document.getElementById('editType').value === 'income' ? 'income' : 'expense';
      const editDate = String(document.getElementById('editDate').value || '').trim();
      const editTime = String(document.getElementById('editTime').value || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(editDate)) {
        document.getElementById('editTxStatus').textContent = '日期格式錯誤，請重新選擇日期';
        return;
      }
      if (!/^([01]\d|2[0-3]):([0-5]\d)$/.test(editTime)) {
        document.getElementById('editTxStatus').textContent = '時間格式錯誤，請使用 HH:mm';
        return;
      }
      let timestamp = `${editDate}T${editTime}:00`;
      try {
        const res = await fetch(`/api/channel/${channelId}/transactions/${editingTransactionId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: amountValue,
            category,
            note,
            type,
            timestamp,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '更新失敗');
        closeEditModal();
        await loadData();
      } catch (error) {
        document.getElementById('editTxStatus').textContent = `更新失敗：${error.message}`;
      }
    }

    async function deleteTransaction(id) {
      if (!confirm('確定要刪除這筆記錄嗎？')) return;
      try {
        const res = await fetch(`/api/channel/${channelId}/transactions/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '刪除失敗');
        await loadData();
      } catch (error) {
        alert(`刪除失敗：${error.message}`);
      }
    }

    function renderTransactionsList(transactions, mode) {
      if (!transactions.length) return '<div class="loading">這個月份還沒有記錄</div>';

      const groups = new Map();
      transactions.forEach((t) => {
        const key = mode === 'by_category'
          ? String(t.category || '未分類')
          : new Date(t.timestamp).toLocaleDateString('zh-TW');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      });

      let html = '';
      Array.from(groups.entries()).forEach(([groupKey, list]) => {
        const groupStyle = mode === 'by_category'
          ? getCategoryBadgeStyle(groupKey)
          : 'background:#1b1b34;color:#dbeafe;border-color:#2a2a4a;';
        html += `<li class="transaction group-header"><div class="t-info"><strong style="${groupStyle};padding:4px 8px;border-radius:999px;border:1px solid #2a2a4a;display:inline-block;">${escapeHtml(groupKey)}</strong></div><div class="t-time">${list.length} 筆</div></li>`;
        list.forEach((t) => {
          const amountPrefix = t.type === 'income' ? '+' : '-';
          const dateTime = formatDateTimeText(t.timestamp);
          const categoryStyle = getCategoryBadgeStyle(t.category, t.type);
          html += `
            <li class="transaction">
              <div class="t-info">
                <span class="t-category" style="${categoryStyle}">${escapeHtml(t.category)}</span>
                <div class="t-note">${escapeHtml(normalizeTransactionNote(t.note))}</div>
                <div class="t-time">${escapeHtml(dateTime)}</div>
              </div>
              <div class="t-amount ${escapeHtml(t.type)}">${amountPrefix}NT$ ${Number(t.amount).toLocaleString()}</div>
              <div class="t-actions">
                <details class="tx-menu">
                  <summary class="btn btn-icon" title="更多操作">⋯</summary>
                  <div class="tx-menu-panel">
                    <button onclick="openEditTransaction(${t.id})">編輯</button>
                    <button class="danger" onclick="deleteTransaction(${t.id})">刪除</button>
                  </div>
                </details>
              </div>
            </li>
          `;
        });
      });
      return html;
    }

    function renderSettlementHistory(settlements, monthParts) {
      if (!Array.isArray(settlements) || !settlements.length) {
        const label = monthParts ? `${Number(monthParts.year)}年${Number(monthParts.month)}月` : '當前月份';
        return `<div class="status-text">${label} 尚無月結記錄（每月 1 號 00:00 會自動產生上月月結）。</div>`;
      }

      const items = settlements.map((row) => {
        const label = `${Number(row.year)}年${Number(row.month)}月`;
        const generatedAt = row.generatedAt
          ? new Date(row.generatedAt).toLocaleString('zh-TW')
          : '-';
        const summary = row.summary || `${label} 月結`;
        return `
          <li class="transaction">
            <div class="t-info">
              <span class="t-category" style="background:#1b1b34;color:#dbeafe;border-color:#2a2a4a;">${escapeHtml(label)}</span>
              <div class="t-note">${escapeHtml(summary)}</div>
              <div class="t-time">產生時間：${escapeHtml(generatedAt)}</div>
            </div>
            <div class="t-actions" style="flex-direction:column;align-items:flex-end;gap:2px;">
              <div class="t-time">收入 +NT$ ${Number(row.income || 0).toLocaleString()}</div>
              <div class="t-time">支出 -NT$ ${Number(row.expense || 0).toLocaleString()}</div>
              <div class="t-time">淨額 NT$ ${Number(row.net || 0).toLocaleString()} · ${Number(row.transactionCount || 0)} 筆</div>
            </div>
          </li>
        `;
      }).join('');

      return `<ul class="transactions">${items}</ul>`;
    }

        '投資': { badgeBg: '#065f46', badgeFg: '#d1fae5', chart: '#059669' },
        '禮物': { badgeBg: '#9d174d', badgeFg: '#fce7f3', chart: '#db2777' },
        '其他': { badgeBg: '#374151', badgeFg: '#f3f4f6', chart: '#6b7280' },
        '未分類': { badgeBg: '#374151', badgeFg: '#f3f4f6', chart: '#6b7280' },
        '薪資': { badgeBg: '#15803d', badgeFg: '#dcfce7', chart: '#22c55e' },
        '兼職': { badgeBg: '#166534', badgeFg: '#dcfce7', chart: '#16a34a' },
        '被動收入': { badgeBg: '#14532d', badgeFg: '#dcfce7', chart: '#15803d' },
        '紅包': { badgeBg: '#b91c1c', badgeFg: '#fee2e2', chart: '#ef4444' },
        '生活費': { badgeBg: '#7e22ce', badgeFg: '#f3e8ff', chart: '#a855f7' },
        '收入': { badgeBg: '#15803d', badgeFg: '#dcfce7', chart: '#22c55e' },
      };
      if (fixedMap[text]) return fixedMap[text];

      const palette = [
        { badgeBg: '#334155', badgeFg: '#e2e8f0', chart: '#64748b' },
        { badgeBg: '#1e3a8a', badgeFg: '#dbeafe', chart: '#3b82f6' },
        { badgeBg: '#4c1d95', badgeFg: '#ede9fe', chart: '#8b5cf6' },
        { badgeBg: '#7f1d1d', badgeFg: '#fee2e2', chart: '#ef4444' },
        { badgeBg: '#14532d', badgeFg: '#dcfce7', chart: '#22c55e' },
      ];
      const key = `${text}|${type}`;
      const hash = Array.from(key).reduce((acc, ch) => (acc * 31 + ch.charCodeAt(0)) % 997, 0);
      return palette[hash % palette.length];
    }

    function getCategoryBadgeStyle(category, type = 'expense') {
      const token = getCategoryColorToken(category, type);
      return `background:${token.badgeBg};color:${token.badgeFg};border-color:${token.badgeBg};`;
    }

    function renderPieCharts(analytics) {
      const expenseCtx = document.getElementById('expensePie');
      const incomeCtx = document.getElementById('incomePie');
      if (!expenseCtx || !incomeCtx || !window.Chart) return;

      const expenseLabels = (analytics.expenseByCategory || []).map((x) => x.category);
      const expenseValues = (analytics.expenseByCategory || []).map((x) => x.total);
      const incomeLabels = (analytics.incomeByCategory || []).map((x) => x.category);
      const incomeValues = (analytics.incomeByCategory || []).map((x) => x.total);
      const expenseColors = expenseLabels.map((label) => getCategoryColorToken(label, 'expense').chart);
      const incomeColors = incomeLabels.map((label) => getCategoryColorToken(label, 'income').chart);

      if (chartExpense) chartExpense.destroy();
      if (chartIncome) chartIncome.destroy();

      chartExpense = new Chart(expenseCtx, {
        type: 'pie',
        data: {
          labels: expenseLabels,
          datasets: [{
            data: expenseValues,
            backgroundColor: expenseColors,
            borderColor: '#e5e7eb',
            borderWidth: 1.5,
          }],
        },
        options: { plugins: { title: { display: true, text: '支出分類占比' }, legend: { labels: { color: '#e0e0e0' } } } },
      });
      chartIncome = new Chart(incomeCtx, {
        type: 'pie',
        data: {
          labels: incomeLabels,
          datasets: [{
            data: incomeValues,
            backgroundColor: incomeColors,
            borderColor: '#e5e7eb',
            borderWidth: 1.5,
          }],
        },
        options: { plugins: { title: { display: true, text: '收入分類占比' }, legend: { labels: { color: '#e0e0e0' } } } },
      });
    }

    function changeMonthPart(part, value) {
      const current = getMonthParts(selectedMonth || getDefaultMonthText()) || getMonthParts(getDefaultMonthText());
      const year = part === 'year' ? Number(value) : Number(current.year);
      const month = part === 'month' ? Number(value) : Number(current.month);
      selectedMonth = `${year}-${String(month).padStart(2, '0')}`;
      loadData();
    }

    function changeListMode(value) {
      listMode = value === 'by_category' ? 'by_category' : 'by_date';
      loadData();
    }

    loadData();
    window.openEditTransaction = openEditTransaction;
    window.closeEditModal = closeEditModal;
    window.onModalBackdropClick = onModalBackdropClick;
    window.submitEditTransaction = submitEditTransaction;
    window.deleteTransaction = deleteTransaction;
    window.saveSettings = saveSettings;
    window.toggleSettingsPanel = toggleSettingsPanel;
    window.addExpenseCategoryTag = addExpenseCategoryTag;
    window.removeExpenseCategoryTag = removeExpenseCategoryTag;
    window.addIncomeCategoryTag = addIncomeCategoryTag;
    window.removeIncomeCategoryTag = removeIncomeCategoryTag;
    window.onEditTypeChange = onEditTypeChange;
    window.addStyleTag = addStyleTag;
    window.removeStyleTag = removeStyleTag;
    window.addRecurringRow = addRecurringRow;
    window.removeRecurringRow = removeRecurringRow;
    window.updateRecurringRow = updateRecurringRow;
    window.importData = importData;
    window.exportData = exportData;
    window.changeMonthPart = changeMonthPart;
    window.changeListMode = changeListMode;
    window.updateCategoryBudgetValue = updateCategoryBudgetValue;
  </script>
</body>
</html>
