    async function submitTransferTransaction() {
      if (!transferringTransactionId) return;
      const targetChannelId = String(document.getElementById('transferTargetChannelId').value || '').trim();
      const status = document.getElementById('transferTxStatus');
      if (!/^\d{8,}$/.test(targetChannelId)) {
        status.textContent = '頻道 ID 格式錯誤，需為數字（至少 8 位）';
        status.className = 'status-text show error';
        return;
      }
      if (targetChannelId === channelId) {
        status.textContent = '目標頻道不能與目前頻道相同';
        status.className = 'status-text show error';
        return;
      }
      status.textContent = '轉移中...';
      status.className = 'status-text show pending';
      try {
        const res = await fetch(`/api/channel/${channelId}/transactions/${transferringTransactionId}/transfer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetChannelId }),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '轉移失敗');
        localStorage.setItem(TRANSFER_LAST_CHANNEL_KEY, targetChannelId);
        closeTransferModal();
        await loadData();
      } catch (error) {
        status.textContent = `轉移失敗：${error.message}`;
        status.className = 'status-text show error';
      }
    }

    function renderTransactionsList(transactions, mode) {
      if (!transactions.length) return '<div class="loading">這個月份還沒有記錄</div>';

      const groups = new Map();
      transactions.forEach((t) => {
        const key = mode === 'by_category'
          ? String(t.category || '未分類')
          : new Date(t.timestamp).toLocaleDateString('zh-TW');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      });

      let html = '';
      Array.from(groups.entries()).forEach(([groupKey, list]) => {
        const groupStyle = mode === 'by_category'
          ? getCategoryBadgeStyle(groupKey)
          : 'background:#1b1b34;color:#dbeafe;border-color:#2a2a4a;';
        const groupNet = list.reduce((sum, tx) => sum + (tx.type === 'income' ? Number(tx.amount || 0) : -Number(tx.amount || 0)), 0);
        const headerRightText = mode === 'by_date'
          ? `日結餘 ${groupNet >= 0 ? '+' : '-'}NT$ ${Math.abs(groupNet).toLocaleString()} · ${list.length} 筆`
          : `分類結餘 ${groupNet >= 0 ? '+' : '-'}NT$ ${Math.abs(groupNet).toLocaleString()} · ${list.length} 筆`;
        html += `<li class="transaction group-header"><div class="t-info"><strong style="${groupStyle};padding:4px 8px;border-radius:999px;border:1px solid #2a2a4a;display:inline-block;">${escapeHtml(groupKey)}</strong></div><div class="t-time">${escapeHtml(headerRightText)}</div></li>`;
        list.forEach((t) => {
          const amountPrefix = t.type === 'income' ? '+' : '-';
          const dateTime = formatDateTimeText(t.timestamp);
          const categoryStyle = getCategoryBadgeStyle(t.category, t.type);
          const isFlagSet = t.exclude_from_budget == 1;
          const isIncomeType = t.type === 'income';
          const excludeBadge = (!isIncomeType && isFlagSet)
            ? `<span class="t-exclude-badge" title="此筆不計入預算">🚫 不計預算</span>`
            : (isIncomeType && isFlagSet)
              ? `<span class="t-income-budget-badge" title="此收入計入預算抵消">💰 抵消預算</span>`
              : '';
          const budgetMenuLabel = isIncomeType
            ? (isFlagSet ? '✅ 取消抵消預算' : '💰 計入預算抵消')
            : (isFlagSet ? '✅ 計入預算' : '🚫 不計入預算');
          html += `
            <li class="transaction${(!isIncomeType && isFlagSet) ? ' excluded-from-budget' : ''}">
              <div class="t-info">
                <span class="t-category" style="${categoryStyle}">${escapeHtml(t.category)}</span>
                ${excludeBadge}
                <div class="t-note">${escapeHtml(normalizeTransactionNote(t.note))}</div>
                <div class="t-time">${escapeHtml(dateTime)}</div>
              </div>
              <div class="t-amount ${escapeHtml(t.type)}">${amountPrefix}NT$ ${Number(t.amount).toLocaleString()}</div>
              <div class="t-actions">
                <details class="tx-menu">
                  <summary class="btn btn-icon" title="更多操作">⋯</summary>
                  <div class="tx-menu-panel">
                    <button onclick="openEditTransaction(${t.id})">編輯</button>
                    <button onclick="toggleExcludeBudget(${t.id}, ${isFlagSet ? 0 : 1})">${budgetMenuLabel}</button>
                    <button onclick="openTransferModal(${t.id})">轉移</button>
                    <button class="danger" onclick="deleteTransaction(${t.id})">刪除</button>
                  </div>
                </details>
              </div>
            </li>
          `;
        });
      });
      return html;
    }

    function renderSettlementHistory(settlements, monthParts) {
      if (!Array.isArray(settlements) || !settlements.length) {
        const label = monthParts ? `${Number(monthParts.year)}年${Number(monthParts.month)}月` : '當前月份';
        return `<div class="status-text">${label} 尚無月結記錄（每月 1 號 00:00 會自動產生上月月結）。</div>`;
      }

      const items = settlements.map((row) => {
        const label = `${Number(row.year)}年${Number(row.month)}月`;
        const generatedAt = row.generatedAt
          ? new Date(row.generatedAt).toLocaleString('zh-TW')
          : '-';
        const summary = row.summary || `${label} 月結`;
        return `
          <li class="transaction">
            <div class="t-info">
              <span class="t-category" style="background:#1b1b34;color:#dbeafe;border-color:#2a2a4a;">${escapeHtml(label)}</span>
              <div class="t-note">${escapeHtml(summary)}</div>
              <div class="t-time">產生時間：${escapeHtml(generatedAt)}</div>
            </div>
            <div class="t-actions" style="flex-direction:column;align-items:flex-end;gap:2px;">
              <div class="t-time">收入 +NT$ ${Number(row.income || 0).toLocaleString()}</div>
              <div class="t-time">支出 -NT$ ${Number(row.expense || 0).toLocaleString()}</div>
              <div class="t-time">淨額 NT$ ${Number(row.net || 0).toLocaleString()} · ${Number(row.transactionCount || 0)} 筆</div>
            </div>
          </li>
        `;
      }).join('');

      return `<ul class="transactions">${items}</ul>`;
    }

    function getCategoryColorToken(category, type = 'expense') {
      const text = String(category || '未分類').trim();
      const fixedMap = {
        '餐飲': { badgeBg: '#6d28d9', badgeFg: '#f3e8ff', chart: '#8b5cf6' },
        '交通': { badgeBg: '#1d4ed8', badgeFg: '#dbeafe', chart: '#3b82f6' },
        '購物': { badgeBg: '#be185d', badgeFg: '#fce7f3', chart: '#ec4899' },
        '娛樂': { badgeBg: '#ea580c', badgeFg: '#ffedd5', chart: '#f97316' },
        '房租/帳單': { badgeBg: '#0f766e', badgeFg: '#ccfbf1', chart: '#14b8a6' },
        '住宿': { badgeBg: '#0e7490', badgeFg: '#cffafe', chart: '#06b6d4' },
        '日常生活': { badgeBg: '#4338ca', badgeFg: '#e0e7ff', chart: '#6366f1' },
        '醫療': { badgeBg: '#047857', badgeFg: '#d1fae5', chart: '#10b981' },
        '教育': { badgeBg: '#7c2d12', badgeFg: '#ffedd5', chart: '#f59e0b' },
        '投資': { badgeBg: '#065f46', badgeFg: '#d1fae5', chart: '#059669' },
        '禮物': { badgeBg: '#9d174d', badgeFg: '#fce7f3', chart: '#db2777' },
        '其他': { badgeBg: '#374151', badgeFg: '#f3f4f6', chart: '#6b7280' },
        '未分類': { badgeBg: '#374151', badgeFg: '#f3f4f6', chart: '#6b7280' },
        '薪資': { badgeBg: '#15803d', badgeFg: '#dcfce7', chart: '#22c55e' },
        '兼職': { badgeBg: '#166534', badgeFg: '#dcfce7', chart: '#16a34a' },
        '被動收入': { badgeBg: '#14532d', badgeFg: '#dcfce7', chart: '#15803d' },
        '紅包': { badgeBg: '#b91c1c', badgeFg: '#fee2e2', chart: '#ef4444' },
        '生活費': { badgeBg: '#7e22ce', badgeFg: '#f3e8ff', chart: '#a855f7' },
        '收入': { badgeBg: '#15803d', badgeFg: '#dcfce7', chart: '#22c55e' },
      };
      if (fixedMap[text]) return fixedMap[text];

      const palette = [
        { badgeBg: '#334155', badgeFg: '#e2e8f0', chart: '#64748b' },
        { badgeBg: '#1e3a8a', badgeFg: '#dbeafe', chart: '#3b82f6' },
        { badgeBg: '#4c1d95', badgeFg: '#ede9fe', chart: '#8b5cf6' },
        { badgeBg: '#7f1d1d', badgeFg: '#fee2e2', chart: '#ef4444' },
        { badgeBg: '#14532d', badgeFg: '#dcfce7', chart: '#22c55e' },
      ];
      const key = `${text}|${type}`;
      const hash = Array.from(key).reduce((acc, ch) => (acc * 31 + ch.charCodeAt(0)) % 997, 0);
      return palette[hash % palette.length];
    }

    function getCategoryBadgeStyle(category, type = 'expense') {
      const token = getCategoryColorToken(category, type);
      return `background:${token.badgeBg};color:${token.badgeFg};border-color:${token.badgeBg};`;
    }

    function renderPieCharts(analytics) {
      const expenseCtx = document.getElementById('expensePie');
      const incomeCtx = document.getElementById('incomePie');
      if (!expenseCtx || !incomeCtx || !window.Chart) return;

      const expenseLabels = (analytics.expenseByCategory || []).map((x) => x.category);
      const expenseValues = (analytics.expenseByCategory || []).map((x) => x.total);
      const incomeLabels = (analytics.incomeByCategory || []).map((x) => x.category);
      const incomeValues = (analytics.incomeByCategory || []).map((x) => x.total);
      const expenseColors = expenseLabels.map((label) => getCategoryColorToken(label, 'expense').chart);
      const incomeColors = incomeLabels.map((label) => getCategoryColorToken(label, 'income').chart);

      if (chartExpense) chartExpense.destroy();
      if (chartIncome) chartIncome.destroy();

      chartExpense = new Chart(expenseCtx, {
        type: 'pie',
        data: {
          labels: expenseLabels,
          datasets: [{
            data: expenseValues,
            backgroundColor: expenseColors,
            borderColor: '#e5e7eb',
            borderWidth: 1.5,
          }],
        },
        options: { plugins: { title: { display: true, text: '支出分類占比' }, legend: { labels: { color: '#e0e0e0' } } } },
      });
      chartIncome = new Chart(incomeCtx, {
        type: 'pie',
        data: {
          labels: incomeLabels,
          datasets: [{
            data: incomeValues,
            backgroundColor: incomeColors,
            borderColor: '#e5e7eb',
            borderWidth: 1.5,
          }],
        },
        options: { plugins: { title: { display: true, text: '收入分類占比' }, legend: { labels: { color: '#e0e0e0' } } } },
      });
    }

    function changeMonthPart(part, value) {
      const current = getMonthParts(selectedMonth || getDefaultMonthText()) || getMonthParts(getDefaultMonthText());
      const year = part === 'year' ? Number(value) : Number(current.year);
      const month = part === 'month' ? Number(value) : Number(current.month);
      selectedMonth = `${year}-${String(month).padStart(2, '0')}`;
      loadData();
    }

    function changeListMode(value) {
      listMode = value === 'by_category' ? 'by_category' : 'by_date';
      loadData();
    }

    loadData();
    window.openEditTransaction = openEditTransaction;
    window.closeEditModal = closeEditModal;
    window.onModalBackdropClick = onModalBackdropClick;
    window.submitEditTransaction = submitEditTransaction;
    window.deleteTransaction = deleteTransaction;
    window.saveSettings = saveSettings;
    window.toggleSettingsPanel = toggleSettingsPanel;
    window.addExpenseCategoryTag = addExpenseCategoryTag;
    window.removeExpenseCategoryTag = removeExpenseCategoryTag;
    window.addIncomeCategoryTag = addIncomeCategoryTag;
    window.removeIncomeCategoryTag = removeIncomeCategoryTag;
    window.onEditTypeChange = onEditTypeChange;
    window.addStyleTag = addStyleTag;
    window.removeStyleTag = removeStyleTag;
    window.addRecurringRow = addRecurringRow;
    window.removeRecurringRow = removeRecurringRow;
    window.updateRecurringRow = updateRecurringRow;
    window.importData = importData;
    window.exportData = exportData;
    window.refreshBackupList = refreshBackupList;
    window.createManualBackup = createManualBackup;
    window.restoreBackupFromUI = restoreBackupFromUI;
    window.changeMonthPart = changeMonthPart;
    window.changeListMode = changeListMode;
    window.updateCategoryBudgetValue = updateCategoryBudgetValue;
  </script>
</body>
</html>
