<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳 - Channel Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f23;
      --card: #1a1a2e;
      --accent: #00d9ff;
      --text: #e0e0e0;
      --muted: #888;
      --green: #4ade80;
      --red: #f87171;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }
    .channel-id {
      background: var(--card);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--muted);
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #2a2a4a;
    }
    
    .balance {
      font-size: 3rem;
      text-align: center;
      font-weight: bold;
    }
    .balance.positive { color: var(--green); }
    .balance.negative { color: var(--red); }
    
    .balance-label {
      text-align: center;
      color: var(--muted);
      margin-bottom: 10px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    .stat {
      background: #0d0d1a;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .stat-value.income { color: var(--green); }
    .stat-value.expense { color: var(--red); }
    .stat-label { color: var(--muted); font-size: 0.9rem; }
    
    .transactions { list-style: none; }
    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a4a;
      gap: 10px;
    }
    .transaction:last-child { border-bottom: none; }
    
    .t-info { flex: 1; }
    .t-category {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #dff4ff;
      border: 1px solid #2a2a4a;
    }
    .t-note { color: var(--text); margin-top: 4px; }
    .t-time { color: var(--muted); font-size: 0.8rem; }
    
    .t-amount {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .t-amount.income { color: var(--green); }
    .t-amount.expense { color: var(--red); }

    .t-exclude-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 999px;
      padding: 1px 7px;
      margin-top: 2px;
    }
    .t-income-budget-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #34d399;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 999px;
      padding: 1px 7px;
      margin-top: 2px;
    }
    .excluded-from-budget .t-amount {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .t-actions {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .tx-menu { position: relative; }
    .tx-menu summary { list-style: none; user-select: none; }
    .tx-menu summary::-webkit-details-marker { display: none; }
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
    }
    .tx-menu-panel {
      position: absolute;
      right: 0;
      top: 36px;
      min-width: 110px;
      background: #111827;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .tx-menu-panel button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tx-menu-panel button:hover { background: #1f2937; }
    .tx-menu-panel button.danger { color: #fca5a5; }

    .btn {
      border: 1px solid #2a2a4a;
      background: #121226;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-danger:hover { border-color: var(--red); color: var(--red); }
    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .btn.loading {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(0, 217, 255, 0.25) inset;
    }
    .btn-save-primary {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-color: #22c55e;
      color: #f0fdf4;
      font-weight: 700;
    }
    .btn-save-primary:hover {
      border-color: #4ade80;
      box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35) inset;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { color: var(--muted); font-size: 0.85rem; }
    .form-field input, .form-field textarea, .form-field select {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
    }
    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status-text {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      background: #111326;
      font-weight: 600;
      display: none;
    }
    .status-text.show { display: block; }
    .status-text.error {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.55);
      background: rgba(127, 29, 29, 0.3);
    }
    .status-text.success {
      color: #bbf7d0;
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(20, 83, 45, 0.3);
    }
    .status-text.pending {
      color: #bae6fd;
      border-color: rgba(0, 217, 255, 0.55);
      background: rgba(8, 47, 73, 0.35);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .settings-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-panel { display: none; }
    .settings-panel.open { display: block; }

    .toast {
      position: fixed;
      right: 20px;
      top: 20px;
      z-index: 9999;
      min-width: 220px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      background: #111326;
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.success {
      border-color: rgba(74, 222, 128, 0.65);
      background: rgba(20, 83, 45, 0.95);
      color: #dcfce7;
    }
    .toast.error {
      border-color: rgba(248, 113, 113, 0.65);
      background: rgba(127, 29, 29, 0.95);
      color: #fee2e2;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2a2a4a;
      background: #101022;
      color: var(--text);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.82rem;
    }
    .chip button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
    }
    .chip button:hover { color: var(--red); }

    .chip-add-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .chip-add-row input { flex: 1; }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .recurring-list {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }
    .recurring-row {
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px;
      background: #101022;
      display: grid;
      grid-template-columns: minmax(140px, 2fr) repeat(3, minmax(90px, 1fr)) auto;
      gap: 8px;
      align-items: center;
    }
    .recurring-row > * {
      min-width: 0;
    }
    .recurring-row input,
    .recurring-row select {
      width: 100%;
    }
    .recurring-row .btn {
      white-space: nowrap;
      padding: 8px 10px;
    }
    .recurring-row .row-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      grid-column: 1 / -1;
    }

    .month-select-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .month-filter-card {
      background: linear-gradient(160deg, #1a1a2e 0%, #16162a 100%);
      border-color: #31315a;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .month-filter-row {
      align-items: flex-start;
      gap: 12px;
    }
    .month-picker-wrap {
      gap: 10px;
    }
    .month-picker {
      position: relative;
      min-width: 112px;
    }
    .month-picker span {
      display: block;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }
    .month-picker select {
      appearance: none;
      width: 100%;
      background: #0f1329;
      border: 1px solid #334155;
      color: #dbeafe;
      border-radius: 999px;
      padding: 8px 34px 8px 12px;
      font-size: 0.9rem;
      line-height: 1.2;
    }
    .month-picker::after {
      content: '▾';
      position: absolute;
      right: 12px;
      bottom: 8px;
      color: #93c5fd;
      pointer-events: none;
      font-size: 0.8rem;
    }
    .month-picker select:hover,
    .month-picker select:focus {
      border-color: #38bdf8;
      outline: none;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }
    .month-global-label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .section-hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .budget-progress-wrap {
      margin-top: 14px;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 10px;
    }
    .budget-progress-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 8px;
    }
    .budget-progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #1f2937;
      overflow: hidden;
    }
    .budget-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      width: 0%;
      transition: width 0.2s ease;
    }
    .budget-progress-meta {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-budget-list {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .category-budget-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .category-budget-item .name {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-track {
      height: 6px;
      border-radius: 999px;
      background: #1f2937;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      border-radius: 999px;
    }
    .category-budget-editor {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .category-budget-row {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 8px;
      align-items: center;
    }
    .category-budget-row .name {
      font-size: 0.88rem;
      color: var(--text);
    }

    .segmented {
      display: inline-flex;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      overflow: hidden;
      background: #0d0d1a;
    }
    .segmented button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .segmented button.active {
      color: var(--text);
      background: #1b1b34;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    
    .error {
      background: #3a1a1a;
      border: 1px solid var(--red);
      padding: 16px;
      border-radius: 8px;
      color: var(--red);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #111827;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px;
    }

    .group-header {
      background: #121226;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    canvas {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
      }
      .channel-id {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
      }
      .balance { font-size: 2.2rem; }
      .stats { grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .toggle-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .month-select-row {
        width: 100%;
      }
      .month-filter-row {
        gap: 10px;
      }
      .month-picker-wrap {
        width: 100%;
      }
      .month-picker {
        flex: 1;
        min-width: 0;
      }
      .month-select-row select {
        flex: 1;
        min-width: 0;
      }
      .segmented {
        width: 100%;
      }
      .segmented button {
        flex: 1;
      }
      .transaction {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .t-amount {
        align-self: flex-end;
      }
      .t-actions {
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .chip-add-row,
      .actions-row {
        flex-direction: column;
        align-items: stretch;
      }
      .recurring-row {
        grid-template-columns: 1fr;
      }
      .recurring-row .row-inline {
        grid-template-columns: 1fr;
      }
      .actions-row .btn {
        width: 100%;
      }
      .category-budget-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .category-budget-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .balance { font-size: 1.8rem; }
      .stat-value { font-size: 1.25rem; }
      .btn { font-size: 0.8rem; }
      .form-field input, .form-field textarea, .form-field select {
        font-size: 0.9rem;
      }
    }
    .page-credit {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 16px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="dashboardTitle">🦑 記帳 Dashboard</h1>
      <span class="channel-id" id="channelId">載入中...</span>
    </header>
    
    <div id="app">
      <div class="loading">載入中...</div>
    </div>
    <div class="page-credit">Powered by CBC0210 · Accounting Bot Dashboard</div>
  </div>
  <div id="saveToast" class="toast" aria-live="polite"></div>
  <div id="txEditModal" class="modal-backdrop" onclick="onModalBackdropClick(event)">
    <div class="modal-card">
      <div class="toggle-row" style="margin-bottom: 12px;">
        <h2 style="margin:0;">✏️ 編輯條目</h2>
        <button class="btn" onclick="closeEditModal()">關閉</button>
      </div>
      <div class="form-grid" style="margin-top:0;">
        <div class="form-field">
          <label>金額</label>
          <input id="editAmount" type="text" inputmode="numeric" placeholder="例如 135" />
        </div>
        <div class="form-field">
          <label>類型</label>
          <select id="editType" onchange="onEditTypeChange()">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div class="form-field">
          <label>日期</label>
          <input id="editDate" type="date" />
        </div>
        <div class="form-field">
          <label>時間</label>
          <input id="editTime" type="time" />
        </div>
        <div class="form-field">
          <label>類別</label>
          <select id="editCategory"></select>
        </div>
        <div class="form-field full">
          <label>備註</label>
          <input id="editNote" type="text" placeholder="可留空" />
        </div>
      </div>
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn" onclick="submitEditTransaction()">儲存修改</button>
      </div>
      <div id="editTxStatus" class="status-text"></div>
    </div>
  </div>
  
  <div id="txTransferModal" class="modal-backdrop" onclick="onTransferModalBackdropClick(event)">
    <div class="modal-card">
      <div class="toggle-row" style="margin-bottom: 12px;">
        <h2 style="margin:0;">↗️ 轉移帳目</h2>
        <button class="btn" onclick="closeTransferModal()">關閉</button>
      </div>
      <p style="color:var(--muted);font-size:0.88rem;margin-bottom:14px;">帳目的所有資訊（金額、分類、時間）保持不變，僅變更所屬頻道。</p>
      <div class="form-grid" style="margin-top:0;">
        <div class="form-field full">
          <label>目標頻道 ID</label>
          <input id="transferTargetChannelId" type="text" inputmode="numeric" placeholder="例如 1234567890123456789" />
        </div>
      </div>
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn btn-save-primary" onclick="submitTransferTransaction()">確認轉移</button>
      </div>
      <div id="transferTxStatus" class="status-text"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    function resolveChannelIdFromUrl() {
      const params = new URLSearchParams(window.location.search || '');
      const fromQuery = String(params.get('channelId') || '').trim();
      if (/^\d{8,}$/.test(fromQuery)) return fromQuery;

      const path = String(window.location.pathname || '').replace(/^\/+|\/+$/g, '');
      if (/^\d{8,}$/.test(path)) return path;

      return '';
    }

    const channelId = resolveChannelIdFromUrl();
    document.getElementById('channelId').textContent = channelId || '無效的 channelId';

    const defaultCategoryTags = [
      '餐飲', '交通', '購物', '娛樂', '房租/帳單', '住宿', '日常生活', '醫療', '教育', '投資', '禮物', '其他',
      '薪資', '兼職', '被動收入', '紅包', '生活費'
    ];
    const defaultIncomeCategoryTags = ['薪資', '兼職', '被動收入', '紅包', '生活費', '收入'];
    const defaultStyleTags = ['友善', '幽默', '精簡'];
    const defaultMealPeriods = {
      breakfast: { start: '05:00', end: '10:59' },
      lunch: { start: '11:00', end: '15:59' },
      dinner: { start: '16:00', end: '21:59' },

      'TWD', 'USD', 'JPY', 'EUR', 'GBP', 'CNY', 'HKD', 'SGD', 'KRW', 'AUD', 'CAD', 'CHF', 'NZD', 'THB', 'MYR', 'IDR', 'VND'
    ];

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function dedupeTags(tags) {
      const seen = new Set();
      return tags
        .map((t) => String(t || '').trim())
        .filter(Boolean)
        .filter((t) => {
          const key = t.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function parseTagsFromSettingsText(text, fallback) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
      const tags = [];
      lines.forEach((line) => {
        if (line.includes('：')) {
          const parts = line.split('：');
          const listText = parts.slice(1).join('：');
          listText.split(/[、,，]/).forEach((token) => tags.push(token.trim()));
        } else {
          line.split(/[、,，]/).forEach((token) => tags.push(token.trim()));
        }
      });
      const cleaned = dedupeTags(tags);
      return cleaned.length ? cleaned : [...fallback];
    }

    function isIncomeCategoryTag(tag) {
      const text = String(tag || '').trim().toLowerCase();
      if (!text) return false;
      return defaultIncomeCategoryTags.some((x) => String(x).toLowerCase() === text);
    }

    function splitCategoryTagsByType(tags) {
      const source = dedupeTags(tags || []);
      const income = [];
      const expense = [];
      source.forEach((tag) => {
        if (isIncomeCategoryTag(tag)) {
          income.push(tag);
        } else {
          expense.push(tag);
        }
      });
      return {
        expense: dedupeTags(expense),
        income: dedupeTags(income),
      };
    }

    function getAllCategoryTags() {
      return dedupeTags([...(expenseCategoryTags || []), ...(incomeCategoryTags || [])]);
    }

    function parseCategoryBudgetsText(text) {
      if (!text) return {};
      try {
        const parsed = JSON.parse(String(text || '{}'));
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
        const out = {};
        Object.entries(parsed).forEach(([k, v]) => {
          const key = String(k || '').trim();
          const amount = Number(v);
          if (!key || !Number.isFinite(amount) || amount <= 0) return;
          out[key] = Math.round(amount);
        });
        return out;
      } catch (_) {
        return {};
      }
    }

    function serializeCategoryBudgets(mapObj) {
      const out = {};
      Object.entries(mapObj || {}).forEach(([k, v]) => {
        const key = String(k || '').trim();
        const amount = Number(v);
        if (!key || !Number.isFinite(amount) || amount <= 0) return;
        out[key] = Math.round(amount);
      });
      return JSON.stringify(out);
    }

    function parseMealPeriodsText(text) {
      if (!text) return { ...defaultMealPeriods };
      try {
        const parsed = JSON.parse(String(text || '{}'));
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return { ...defaultMealPeriods };
        const out = {};
        Object.keys(defaultMealPeriods).forEach((key) => {
          const src = parsed[key] || defaultMealPeriods[key];
          const start = String(src?.start || '').trim();
          const end = String(src?.end || '').trim();
          out[key] = {
            start: /^([01]\d|2[0-3]):([0-5]\d)$/.test(start) ? start : defaultMealPeriods[key].start,
            end: /^([01]\d|2[0-3]):([0-5]\d)$/.test(end) ? end : defaultMealPeriods[key].end,
          };
        });
        return out;
      } catch (_) {
        return { ...defaultMealPeriods };
      }
    }

    function serializeMealPeriods(periods) {
      const out = {};
      Object.keys(defaultMealPeriods).forEach((key) => {
        const start = String(periods?.[key]?.start || defaultMealPeriods[key].start).trim();
        const end = String(periods?.[key]?.end || defaultMealPeriods[key].end).trim();
        out[key] = { start, end };
      });
      return JSON.stringify(out);
    }

    function parseMonthlyBudgetsText(text) {
      if (!text) return {};
      try {
        const parsed = JSON.parse(String(text || '{}'));
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
        const out = {};
        Object.entries(parsed).forEach(([k, v]) => {
          const key = String(k || '').trim();
          const amount = Number(v);
          if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(key)) return;
          if (!Number.isFinite(amount) || amount < 0) return;
          out[key] = Math.round(amount);
        });
        return out;
      } catch (_) {
        return {};
      }
    }

    function serializeMonthlyBudgets(mapObj) {
      const out = {};
      Object.entries(mapObj || {}).forEach(([k, v]) => {
        const key = String(k || '').trim();
        const amount = Number(v);
        if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(key)) return;
        if (!Number.isFinite(amount) || amount < 0) return;
        out[key] = Math.round(amount);
      });
      return JSON.stringify(out);
    }

    function setStatus(message, isError = false, mode = 'info') {

      statusEl.classList.toggle('show', Boolean(statusEl.textContent));

    function formatBackupWhen(isoText) {
      const d = new Date(isoText || Date.now());
      if (Number.isNaN(d.getTime())) return String(isoText || '-');
      return d.toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei',

        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      });

    function buildBackupOptionRows(list) {
      const rows = Array.isArray(list) ? list : [];
      if (!rows.length) return '<option value="">目前沒有備份</option>';
      return rows.map((item) => {
        const when = formatBackupWhen(item.createdAt || item.updatedAt);

    let saveToastTimer = null;

      if (saveToastTimer) clearTimeout(saveToastTimer);
      toast.textContent = String(message || '').trim();

    function getLedgerDisplayName(ledgerType, title, fallbackName) {

      if (t) return `${t}的帳本`;

    function normalizeTransactionNote(noteText) {

      if (!text) return '-';
      if (/^來自頻道\s+\d+$/.test(text)) return '來自其他帳本';

    function getMonthParts(monthText) {
      const match = String(monthText || '').match(/^(\d{4})-(\d{2})$/);
      if (!match) return null;
      return { year: Number(match[1]), month: Number(match[2]) };
    }

    function getDefaultMonthText() {

    }

    function buildYearOptions(selectedYear) {
      const currentYear = new Date().getFullYear();
      const years = [];
      for (let y = currentYear - 5; y <= currentYear; y += 1) years.push(y);
      const selected = Number(selectedYear);
      if (Number.isFinite(selected) && !years.includes(selected)) years.push(selected);
      years.sort((a, b) => a - b);
      return years
        .map((y) => `<option value="${y}" ${Number(selectedYear) === y ? 'selected' : ''}>${y}年</option>`)
        .join('');
    }

    function buildMonthOptions(selectedMonthNum) {

        .join('');
    }

    function normalizeRecurringCurrency(value, fallback = 'TWD') {
      const text = String(value || '').trim().toUpperCase();
      if (supportedCurrencies.includes(text)) return text;
      return String(fallback || 'TWD').trim().toUpperCase() || 'TWD';
    }

    function createEmptyRecurringRow(defaultCurrency = accountCurrency || 'TWD') {
      return {
        name: '',
        amount: '',
        scheduleType: 'monthly',
        month: '',
        day: '',
        weekday: '一',
        time: '09:00',
        type: 'expense',
        monthlyPolicy: 'clip_to_last_day',
        currency: normalizeRecurringCurrency(defaultCurrency, 'TWD'),
      };
    }

    function parseRecurringRowsText(text, defaultCurrency = 'TWD') {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);

      const rows = lines.map((line) => {
        const parts = line.split(/[,\uFF0C]/).map((v) => v.trim());
        if (parts.length < 4) return null;
        const options = {};
        parts.slice(4).forEach((token) => {
          const idx = String(token || '').indexOf('=');
          if (idx <= 0) return;
          const key = String(token.slice(0, idx)).trim().toLowerCase();
          const val = String(token.slice(idx + 1)).trim();
          if (!key) return;
          options[key] = val;
        });
        const name = parts[0];
        const amount = String(Number(parts[1]) || '');
        const schedule = parts[2];
        const type = parts[3] === 'income' ? 'income' : 'expense';
        let scheduleType = 'monthly';
        let month = '';
        let day = '';
        let weekday = '一';
        let time = '09:00';
        const monthlyPolicyRaw = String(options.monthlypolicy || options.month_policy || 'clip_to_last_day').trim().toLowerCase();
        const monthlyPolicy = ['clip_to_last_day', 'skip_month', 'rollover_next_month'].includes(monthlyPolicyRaw)
          ? monthlyPolicyRaw
          : 'clip_to_last_day';
        const currency = normalizeRecurringCurrency(options.currency || options.ccy, defaultCurrency);

        let m = schedule.match(/^每月(\d{1,2})號?(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'monthly';
          day = m[1];
          if (m[2]) time = m[2];
          return { name, amount, scheduleType, day, weekday, time, type, monthlyPolicy, currency };
        }

        m = schedule.match(/^每週([一二三四五六日天])(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'weekly';
          weekday = m[1] === '天' ? '日' : m[1];
          if (m[2]) time = m[2];
          return { name, amount, scheduleType, day, weekday, time, type, monthlyPolicy, currency };
        }

        m = schedule.match(/^每日(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'daily';
          if (m[1]) time = m[1];
          return { name, amount, scheduleType, month, day, weekday, time, type, monthlyPolicy, currency };
        }

        m = schedule.match(/^每年(\d{1,2})(?:\/|月)(\d{1,2})日?(?:\s+(\d{1,2}:\d{2}))?$/);
        if (m) {
          scheduleType = 'yearly';
          month = m[1];
          day = m[2];
          if (m[3]) time = m[3];
          return { name, amount, scheduleType, month, day, weekday, time, type, monthlyPolicy, currency };
        }

        return { name, amount, scheduleType, month, day, weekday, time, type, monthlyPolicy, currency };
      }).filter(Boolean);

      return rows.length ? rows : [createEmptyRecurringRow(defaultCurrency)];
    }

    function recurringRowsToText(rows, baseCurrency = 'TWD') {
      return rows
        .map((row) => {
          const name = String(row.name || '').trim();
          const amount = Number(String(row.amount || '').trim());
          const time = String(row.time || '').trim();
          const monthlyPolicyRaw = String(row.monthlyPolicy || 'clip_to_last_day').trim().toLowerCase();
          const monthlyPolicy = ['clip_to_last_day', 'skip_month', 'rollover_next_month'].includes(monthlyPolicyRaw)
            ? monthlyPolicyRaw
            : 'clip_to_last_day';
          const currency = normalizeRecurringCurrency(row.currency, baseCurrency);
          if (!name || !Number.isFinite(amount) || amount <= 0 || !isValidTime(time)) return null;

          let schedule = `每月${Number(row.day || 1)}號 ${time}`;
          if (row.scheduleType === 'weekly') {
            schedule = `每週${row.weekday || '一'} ${time}`;
          } else if (row.scheduleType === 'daily') {
            schedule = `每日 ${time}`;
          } else if (row.scheduleType === 'yearly') {
            schedule = `每年${Number(row.month || 1)}/${Number(row.day || 1)} ${time}`;
          }
          const parts = [
            name,
            Math.round(amount),
            schedule,
            row.type === 'income' ? 'income' : 'expense',
            `currency=${currency}`,
          ];
          if (row.scheduleType === 'monthly' || row.scheduleType === 'yearly') {
            parts.push(`monthlyPolicy=${monthlyPolicy}`);
          }
          return parts.join(',');
        })
        .filter(Boolean)
        .join('\n');
    }

    function toWeekdayIndex(weekdayText) {
      const map = { 日: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 };
      return map[String(weekdayText || '').trim()] ?? null;
    }

    function buildRangeSelectOptions(min, max, selectedValue, suffix = '') {
      const selected = String(selectedValue ?? '').trim();
      const options = [`<option value="">請選擇</option>`];
      for (let i = min; i <= max; i += 1) {
        const value = String(i);
        options.push(`<option value="${value}" ${selected === value ? 'selected' : ''}>${value}${suffix}</option>`);
      }
      return options.join('');
    }

    function applyMonthlyDay(year, monthIndex, day, monthlyPolicy) {
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      const targetDay = Number(day);
      if (!Number.isInteger(targetDay) || targetDay < 1 || targetDay > 31) return null;
      if (targetDay <= lastDay) return { year, monthIndex, day: targetDay };
      if (monthlyPolicy === 'skip_month') return null;
      if (monthlyPolicy === 'rollover_next_month') {
        const next = new Date(year, monthIndex + 1, 1);
        return { year: next.getFullYear(), monthIndex: next.getMonth(), day: 1 };
      }
      return { year, monthIndex, day: lastDay };
    }

    function estimateNextRecurringRun(row, now = new Date()) {
      const scheduleType = ['monthly', 'weekly', 'daily', 'yearly'].includes(String(row?.scheduleType || ''))
        ? String(row.scheduleType)
        : 'monthly';
      const time = String(row?.time || '').trim();
      if (!isValidTime(time)) return null;
      const [hour, minute] = time.split(':').map((v) => Number(v));

      if (scheduleType === 'daily') {
        const candidate = new Date(now);
        candidate.setHours(hour, minute, 0, 0);
        if (candidate <= now) candidate.setDate(candidate.getDate() + 1);
        return candidate;
      }

      if (scheduleType === 'weekly') {
        const targetWeekday = toWeekdayIndex(row?.weekday);
        if (targetWeekday === null) return null;
        const candidate = new Date(now);
        candidate.setHours(hour, minute, 0, 0);
        let delta = targetWeekday - candidate.getDay();
        if (delta < 0 || (delta === 0 && candidate <= now)) delta += 7;
        candidate.setDate(candidate.getDate() + delta);
        return candidate;
      }

      if (scheduleType === 'yearly') {
        const monthlyPolicy = String(row?.monthlyPolicy || 'clip_to_last_day');
        const targetMonth = Number(String(row?.month || '').trim());
        const targetDay = Number(String(row?.day || '').trim());
        if (!Number.isInteger(targetMonth) || targetMonth < 1 || targetMonth > 12) return null;
        if (!Number.isInteger(targetDay) || targetDay < 1 || targetDay > 31) return null;
        const buildYearly = (year) => {
          const applied = applyMonthlyDay(year, targetMonth - 1, targetDay, monthlyPolicy);
          if (!applied) return null;
          return new Date(applied.year, applied.monthIndex, applied.day, hour, minute, 0, 0);
        };
        const thisYear = buildYearly(now.getFullYear());
        if (thisYear && thisYear > now) return thisYear;
        return buildYearly(now.getFullYear() + 1);
      }

      const monthlyPolicy = String(row?.monthlyPolicy || 'clip_to_last_day');
      const targetDay = Number(String(row?.day || '').trim());
      if (!Number.isInteger(targetDay) || targetDay < 1 || targetDay > 31) return null;
      let year = now.getFullYear();
      let monthIndex = now.getMonth();
      for (let i = 0; i < 18; i += 1) {
        const applied = applyMonthlyDay(year, monthIndex, targetDay, monthlyPolicy);
        if (applied) {
          const candidate = new Date(applied.year, applied.monthIndex, applied.day, hour, minute, 0, 0);
          if (candidate > now) return candidate;
        }
        const nextMonth = new Date(year, monthIndex + 1, 1);
        year = nextMonth.getFullYear();
        monthIndex = nextMonth.getMonth();
      }
      return null;
    }

    function formatNextRecurringRunText(row) {
      const next = estimateNextRecurringRun(row, new Date());
      if (!next) return '下次執行：設定尚未完整，無法計算';
      const date = next.toLocaleDateString('zh-TW');
      const hh = String(next.getHours()).padStart(2, '0');
      const mm = String(next.getMinutes()).padStart(2, '0');
      return `下次執行：${date} ${hh}:${mm}`;
    }

    function isRecurringRowBlank(row) {
      const name = String(row?.name || '').trim();
      const amountStr = String(row?.amount ?? '').trim();
      const amount = Number(amountStr.replace(/[,\s]/g, ''));
      const hasName = Boolean(name);
      const hasAmount = Number.isFinite(amount) && amount > 0;
      return !hasName && !hasAmount;
    }

    function renderRecurringRows() {
      if (!recurringRows.length) {
        return '<div class="status-text show">目前沒有週期收支，可點「新增週期收支」加入。</div>';
      }
      return recurringRows.map((row, idx) => `
        <div class="recurring-row">
          <input type="text" placeholder="名稱（例：房租）" value="${escapeHtml(row.name)}" onchange="updateRecurringRow(${idx}, 'name', this.value)" />
          <input type="text" inputmode="numeric" placeholder="金額" value="${escapeHtml(row.amount)}" onchange="updateRecurringRow(${idx}, 'amount', this.value)" />
          <select onchange="updateRecurringRow(${idx}, 'scheduleType', this.value)">
            <option value="monthly" ${row.scheduleType === 'monthly' ? 'selected' : ''}>每月</option>
            <option value="weekly" ${row.scheduleType === 'weekly' ? 'selected' : ''}>每週</option>
            <option value="daily" ${row.scheduleType === 'daily' ? 'selected' : ''}>每日</option>
            <option value="yearly" ${row.scheduleType === 'yearly' ? 'selected' : ''}>每年</option>
          </select>
          <select onchange="updateRecurringRow(${idx}, 'type', this.value)">
            <option value="expense" ${row.type === 'expense' ? 'selected' : ''}>支出</option>
            <option value="income" ${row.type === 'income' ? 'selected' : ''}>收入</option>
          </select>
          <button class="btn btn-danger" onclick="removeRecurringRow(${idx})">刪除</button>
          <div class="row-inline">
            ${row.scheduleType === 'monthly'
              ? `<select onchange="updateRecurringRow(${idx}, 'day', this.value)">
                  ${buildRangeSelectOptions(1, 31, row.day, '號')}
                </select>`
              : row.scheduleType === 'yearly'
                ? `<div class="row-inline">
                    <select onchange="updateRecurringRow(${idx}, 'month', this.value)">
                      ${buildRangeSelectOptions(1, 12, row.month, '月')}
                    </select>
                    <select onchange="updateRecurringRow(${idx}, 'day', this.value)">
                      ${buildRangeSelectOptions(1, 31, row.day, '日')}
                    </select>
                  </div>`
              : row.scheduleType === 'weekly'
                ? `<select onchange="updateRecurringRow(${idx}, 'weekday', this.value)">
                    ${['一','二','三','四','五','六','日'].map((d) => `<option value="${d}" ${row.weekday === d ? 'selected' : ''}>週${d}</option>`).join('')}
                  </select>`
                : `<div class="status-text">每日固定執行</div>`}
            <input type="time" value="${escapeHtml(row.time)}" onchange="updateRecurringRow(${idx}, 'time', this.value)" />
          </div>
          ${(row.scheduleType === 'monthly' || row.scheduleType === 'yearly')
            ? `<div class="row-inline">
                <select onchange="updateRecurringRow(${idx}, 'monthlyPolicy', this.value)">
                  <option value="clip_to_last_day" ${row.monthlyPolicy === 'clip_to_last_day' ? 'selected' : ''}>無此日期時補齊月底</option>
                  <option value="skip_month" ${row.monthlyPolicy === 'skip_month' ? 'selected' : ''}>無此日期時略過</option>
                  <option value="rollover_next_month" ${row.monthlyPolicy === 'rollover_next_month' ? 'selected' : ''}>無此日期時延到下月 1 日</option>
                </select>
                <input list="currencyCodeList" type="text" placeholder="幣別（可搜尋）" value="${escapeHtml(row.currency || accountCurrency || 'TWD')}" onchange="updateRecurringRow(${idx}, 'currency', this.value.toUpperCase())" />
              </div>`
            : `<div class="row-inline">
                <input list="currencyCodeList" type="text" placeholder="幣別（可搜尋）" value="${escapeHtml(row.currency || accountCurrency || 'TWD')}" onchange="updateRecurringRow(${idx}, 'currency', this.value.toUpperCase())" />
                <div class="status-text show">此排程不套用月末策略</div>
              </div>`
          }
          <div class="row-inline">
            <div class="status-text show">匯率模式：自動每日匯率（依帳本主幣別換算）</div>
            <div class="status-text show">幣別不同時會自動用當日匯率換算，無需手動填匯率。</div>
          </div>
          <div class="row-inline">
            <div class="status-text show">說明：系統將使用當日匯率 API 自動換算。</div>
            <div class="status-text show">目前帳本幣別：${escapeHtml(accountCurrency || 'TWD')}</div>
          </div>
          <div class="row-inline">
            <div class="status-text show">${escapeHtml(formatNextRecurringRunText(row))}</div>
            <div class="status-text show">排程類型：${row.scheduleType === 'monthly' ? '每月' : row.scheduleType === 'weekly' ? '每週' : row.scheduleType === 'yearly' ? '每年' : '每日'}</div>
          </div>
        </div>
      `).join('');
    }

    async function loadData() {
      try {
        if (!channelId) {
          document.getElementById('app').innerHTML = '<div class="error">錯誤: URL 缺少有效的 channelId</div>';
          return;
        }
        if (!selectedMonth) selectedMonth = getDefaultMonthText();
        const monthParts = getMonthParts(selectedMonth) || getMonthParts(getDefaultMonthText());
        const [channelRes, settingsRes, analyticsRes, monthTxRes, settlementRes, backupRes] = await Promise.all([
          fetch(`/api/channel/${channelId}`),
          fetch(`/api/channel/${channelId}/settings`),
          fetch(`/api/channel/${channelId}/analytics/month?year=${monthParts.year}&month=${monthParts.month}`),
          fetch(`/api/channel/${channelId}/transactions?year=${monthParts.year}&month=${monthParts.month}`),
          fetch(`/api/channel/${channelId}/settlements?limit=12`),
          fetch('/api/backups?limit=30'),
        ]);
        const data = await channelRes.json();
        const settings = await settingsRes.json();
        const analytics = await analyticsRes.json();
        const monthTxPayload = await monthTxRes.json();
        const settlementPayload = await settlementRes.json();
        const backupPayload = await backupRes.json();
        const monthTransactions = Array.isArray(monthTxPayload.transactions) ? monthTxPayload.transactions : [];
        const settlements = Array.isArray(settlementPayload.settlements) ? settlementPayload.settlements : [];
        const currentMonthSettlement = settlements.find(
          (row) => Number(row.year) === Number(monthParts.year) && Number(row.month) === Number(monthParts.month)
        );
        const filteredSettlements = currentMonthSettlement ? [currentMonthSettlement] : [];
        currentMonthTransactions = monthTransactions;
        backupEntries = Array.isArray(backupPayload?.backups) ? backupPayload.backups : [];
        backupConfig = backupPayload?.config || null;

        if (data.error) {
          document.getElementById('app').innerHTML = `<div class="error">錯誤: ${escapeHtml(data.error)}</div>`;
          return;
        }

        const allTags = parseTagsFromSettingsText(settings.categoriesText, defaultCategoryTags);
        const splitTags = splitCategoryTagsByType(allTags);
        expenseCategoryTags = splitTags.expense;
        incomeCategoryTags = splitTags.income;
        styleTags = parseTagsFromSettingsText(settings.chatStyleTagsText, defaultStyleTags);
        categoryBudgets = parseCategoryBudgetsText(settings.categoryBudgetsText);
        mealPeriods = parseMealPeriodsText(settings.mealPeriodsText || '');
        monthlyBudgets = parseMonthlyBudgetsText(settings.monthlyBudgetsText || '');
        try {
          categoryRulesPretty = JSON.stringify(JSON.parse(settings.categoryRulesText || '[]'), null, 2);
        } catch (_) {
          categoryRulesPretty = String(settings.categoryRulesText || '[]');
        }
        accountCurrency = String(settings.currency || 'TWD').trim().toUpperCase() || 'TWD';
        recurringRows = parseRecurringRowsText(settings.recurringItemsText || '', accountCurrency);
        const ledgerName = getLedgerDisplayName(
          settings.ledgerType || data.ledgerType,
          settings.title,
          settings.ledgerName || data.ledgerName
        );
        document.getElementById('dashboardTitle').textContent = `🦑 ${ledgerName}`;
        document.getElementById('channelId').textContent = channelId;
        document.title = `${ledgerName} - Dashboard`;

        const balanceClass = data.balance >= 0 ? 'positive' : 'negative';
        const balancePrefix = data.balance >= 0 ? '+' : '';
        const totalIncome = Number(data.totalIncome || 0);
        const totalExpense = Number(data.totalExpense || 0);
        const monthIncome = Number(analytics?.totals?.income || 0);
        const monthExpense = Number(analytics?.totals?.expense || 0);
        const monthBudgetExpense = Number(analytics?.totals?.budgetExpense ?? analytics?.totals?.expense ?? 0);
        const monthNet = Number(analytics?.totals?.net || 0);
        const globalBudgetValue = Number(settings?.budget || 0);
        const monthKey = `${monthParts.year}-${String(monthParts.month).padStart(2, '0')}`;
        const hasMonthBudgetOverride = Object.prototype.hasOwnProperty.call(monthlyBudgets, monthKey);
        const budgetValue = hasMonthBudgetOverride
          ? Number(monthlyBudgets[monthKey] || 0)
          : globalBudgetValue;
        const budgetPercentRaw = budgetValue > 0 ? (monthBudgetExpense / budgetValue) * 100 : 0;
        const budgetPercent = Number.isFinite(budgetPercentRaw) ? Math.max(0, budgetPercentRaw) : 0;
        const budgetPercentDisplay = Math.round(budgetPercent * 10) / 10;
        const budgetProgressWidth = Math.min(100, Math.max(0, budgetPercent));
        const budgetRemaining = Math.max(0, budgetValue - monthBudgetExpense);
        const monthTotalDays = new Date(monthParts.year, monthParts.month, 0).getDate();
        const now = new Date();
        const currentMonthKey = now.getFullYear() * 100 + (now.getMonth() + 1);
        const selectedMonthKey = monthParts.year * 100 + monthParts.month;
        const remainingDays = selectedMonthKey === currentMonthKey
          ? Math.max(1, monthTotalDays - now.getDate() + 1)
          : selectedMonthKey > currentMonthKey
            ? monthTotalDays
            : 0;
        const dailyBudgetAvailable = remainingDays > 0 ? budgetRemaining / remainingDays : 0;
        const expenseByCategoryMap = new Map(
          (analytics?.expenseByCategory || []).map((row) => [String(row.category || '未分類'), Number(row.total || 0)])
        );
        const expenseTagSet = new Set(dedupeTags(expenseCategoryTags || []).map((x) => String(x)));
        const configuredCategoryBudgetRows = Object.entries(categoryBudgets || {})
          .map(([name, amount]) => ({
            name,
            budget: Number(amount || 0),
            spent: Number(expenseByCategoryMap.get(name) || 0),
          }))
          .filter((row) => row.budget > 0 && expenseTagSet.has(String(row.name)))
          .sort((a, b) => b.budget - a.budget);
        const monthLabel = `${monthParts.year}年${monthParts.month}月`;

        const transactionsHtml = renderTransactionsList(monthTransactions, listMode);

        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="balance-label">目前餘額</div>
            <div class="balance ${balanceClass}">${balancePrefix}NT$ ${data.balance.toLocaleString()}</div>
            <div class="stats">
              <div class="stat">
                <div class="stat-value income">+NT$ ${totalIncome.toLocaleString()}</div>
                <div class="stat-label">累計總收入</div>
              </div>
              <div class="stat">
                <div class="stat-value expense">-NT$ ${totalExpense.toLocaleString()}</div>
                <div class="stat-label">累計總支出</div>
              </div>
            </div>
            <div class="section-hint">${monthLabel} 淨額：NT$ ${monthNet.toLocaleString()}</div>
          </div>

          <div class="card month-filter-card">
            <div class="toggle-row month-filter-row">
              <div>
                <h2 style="margin: 0;">🗓️ 月份</h2>
              </div>
              <div class="month-select-row month-picker-wrap">
                <label class="month-picker">
                  <span>年份</span>
                  <select id="yearPicker" onchange="changeMonthPart('year', this.value)">
                    ${buildYearOptions(monthParts.year)}
                  </select>
                </label>
                <label class="month-picker">
                  <span>月份</span>
                  <select id="monthPicker" onchange="changeMonthPart('month', this.value)">
                    ${buildMonthOptions(monthParts.month)}
                  </select>
                </label>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="toggle-row">
              <h2 style="margin: 0;">📉 月預算使用量</h2>
              <div class="month-global-label">${monthLabel}</div>
            </div>
            <div class="budget-progress-wrap" style="margin-top: 0;">
              <div class="budget-progress-title">
                <span>預算使用率</span>
                <strong>${budgetValue > 0 ? `${budgetPercentDisplay}%` : '未設定預算'}</strong>
              </div>
              <div class="budget-progress-track">
                <div class="budget-progress-fill" style="width:${budgetProgressWidth}%;"></div>
              </div>
              <div class="budget-progress-meta">
                <span>已用 NT$ ${monthBudgetExpense.toLocaleString()}${monthBudgetExpense !== monthExpense ? ` <span style="color:var(--muted);font-size:0.78rem;">（實際支出 ${monthExpense.toLocaleString()}）</span>` : ''}</span>
                <span>預算 NT$ ${budgetValue.toLocaleString()}${hasMonthBudgetOverride ? '（本月覆寫）' : '（全域）'}</span>
                <span>剩餘 NT$ ${budgetRemaining.toLocaleString()}</span>
                <span>日均可用 NT$ ${Math.round(dailyBudgetAvailable).toLocaleString()}（剩餘 ${remainingDays} 天）</span>
              </div>
              ${configuredCategoryBudgetRows.length ? `
                <div class="category-budget-list">
                  ${configuredCategoryBudgetRows.map((row, idx) => {
                    const percent = row.budget > 0 ? (row.spent / row.budget) * 100 : 0;
                    const width = Math.max(0, Math.min(100, percent));
                    const color = categoryBudgetColors(idx);
                    return `
                      <div class="category-budget-item">
                        <div class="name">${escapeHtml(row.name)}</div>
                        <div class="mini-track"><div class="mini-fill" style="width:${width}%;background:${color};"></div></div>
                        <div>${Math.round(percent * 10) / 10}%（${Number(row.spent || 0).toLocaleString()} / ${Number(row.budget || 0).toLocaleString()}）</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          </div>

          <div class="card">
            <div class="toggle-row">
              <h2 style="margin: 0;">📊 月分析</h2>
              <div class="month-global-label">${monthLabel}</div>
            </div>
            <div class="stats">
              <div class="stat">
                <div class="stat-value income">+NT$ ${monthIncome.toLocaleString()}</div>
                <div class="stat-label">收入</div>
              </div>
              <div class="stat">
                <div class="stat-value expense">-NT$ ${monthExpense.toLocaleString()}</div>
                <div class="stat-label">支出</div>
              </div>
            </div>
            <div style="margin-top: 10px; color: var(--muted);">${monthLabel} 結餘：NT$ ${monthNet.toLocaleString()}</div>
            <div class="stats" style="margin-top: 16px;">
              <div class="stat"><canvas id="expensePie" height="220"></canvas></div>
              <div class="stat"><canvas id="incomePie" height="220"></canvas></div>
            </div>
          </div>

          <div class="card">
            <div class="toggle-row">
              <h2 style="margin: 0;">📝 月條目</h2>
              <div class="segmented">
                <button class="${listMode === 'by_date' ? 'active' : ''}" onclick="changeListMode('by_date')">依日期</button>
                <button class="${listMode === 'by_category' ? 'active' : ''}" onclick="changeListMode('by_category')">依分類</button>
              </div>
            </div>
            <div class="status-text">${monthLabel} · 目前模式：${listMode === 'by_date' ? '依日期（每天）' : '依分類（標籤）'}</div>
            <ul class="transactions">${transactionsHtml}</ul>
          </div>

          <div class="card">
            <div class="toggle-row">
              <h2 style="margin: 0;">🧾 月結記錄</h2>
              <div class="month-global-label">${monthLabel}</div>
            </div>
            ${renderSettlementHistory(filteredSettlements, monthParts)}
          </div>

          <div class="card">
            <div class="toggle-row">
              <h2 style="margin: 0;">⚙️ 設定</h2>
              <div class="settings-top-actions">
                ${settingsPanelOpen ? '<button class="btn save-settings-btn btn-save-primary" onclick="saveSettings()">儲存設定</button>' : ''}

                  />

                <div class="form-field">

                </div>
                <div class="form-field">
                  <label>每日提醒開關</label>
                  <select id="reminderEnabledInput">
                    <option value="true" ${settings.reminderEnabled ? 'selected' : ''}>開啟</option>
                    <option value="false" ${!settings.reminderEnabled ? 'selected' : ''}>關閉</option>
                  </select>

                <div class="form-field">
                  <label>性別</label>
                  <select id="genderInput">
                    <option value="">未設定</option>
                    <option value="male" ${settings.gender === 'male' ? 'selected' : ''}>男</option>
                    <option value="female" ${settings.gender === 'female' ? 'selected' : ''}>女</option>
                    <option value="other" ${settings.gender === 'other' ? 'selected' : ''}>其他</option>
                  </select>
                </div>
                <div class="form-field">
                  <label>稱呼</label>
                  <input id="titleInput" type="text" placeholder="例如：柏丞" value="${escapeHtml(settings.title || '')}" />
                </div>
                <div class="form-field">

                  <input id="currencyInput" type="text" placeholder="TWD" value="${escapeHtml(settings.currency || 'TWD')}" />
                </div>

                  <select id="showBalanceInNameInput">
                    <option value="true" ${settings.showBalanceInName ? 'selected' : ''}>開啟</option>

                <div class="form-field">

                        <input id="mealLunchEnd" type="time" value="${escapeHtml(mealPeriods?.lunch?.end || defaultMealPeriods.lunch.end)}" />
                      </div>

                    <div class="form-field">

                <div class="form-field full">

                    <button class="btn" onclick="exportData('json')">匯出 JSON</button>
                    <button class="btn" onclick="exportData('csv')">匯出 CSV</button>
                  </div>
                  <div class="actions-row">
                    <input id="importFileInput" type="file" accept=".json,.csv,application/json,text/csv" />
                    <select id="importModeInput">
                      <option value="append">附加匯入</option>
                      <option value="replace">覆蓋本頻道交易</option>

                    <button class="btn" onclick="importData()">匯入檔案</button>

                  <div class="form-field" style="margin-top:10px;">
                    <label>資料庫備份與回檔（全域）</label>
                    <div class="actions-row">
                      <button class="btn" onclick="createManualBackup()">立即備份</button>

                    <div id="backupStatus" class="status-text"></div>
                  </div>
                  <div id="settingsStatus" class="status-text"></div>
                </div>
              </div>
            </div>
          </div>
        `;
        renderPieCharts(analytics);
      } catch (error) {
        document.getElementById('app').innerHTML = `<div class="error">載入失敗: ${escapeHtml(error.message)}</div>`;

    function updateRecurringRow(index, field, value) {
      recurringRows = recurringRows.map((row, idx) => {
        if (idx !== index) return row;
        const next = { ...row, [field]: String(value || '').trim() };
        if (field === 'scheduleType') {
          const scheduleType = ['monthly', 'weekly', 'daily', 'yearly'].includes(next.scheduleType) ? next.scheduleType : 'monthly';
          next.scheduleType = scheduleType;
          if (scheduleType === 'monthly') {
            if (!next.day) next.day = '';
            if (!next.monthlyPolicy) next.monthlyPolicy = 'clip_to_last_day';
          } else if (scheduleType === 'yearly') {
            if (!next.month) next.month = '';
            if (!next.day) next.day = '';
            if (!next.monthlyPolicy) next.monthlyPolicy = 'clip_to_last_day';
          } else if (scheduleType === 'weekly') {
            if (!next.weekday) next.weekday = '一';
          }
          if (!next.time) next.time = '09:00';
        }
        if (field === 'currency') {
          next.currency = String(value || '').trim().toUpperCase();
        }
        return next;
      });
      setStatus('');
      if (field === 'scheduleType') {
        rerenderRecurringRows();
      }
      if (['month', 'day', 'weekday', 'time', 'monthlyPolicy'].includes(field)) {
        rerenderRecurringRows();
      }
    }

    function validateRecurringRows(rows, baseCurrency = 'TWD') {
      const base = normalizeRecurringCurrency(baseCurrency, 'TWD');
      for (let i = 0; i < (rows || []).length; i += 1) {
        const row = rows[i] || {};
        if (isRecurringRowBlank(row)) continue;
        const rowNo = i + 1;
        const name = String(row.name || '').trim();
        if (!name) return { ok: false, row: rowNo, message: '名稱不可為空' };
        const amount = Number(String(row.amount || '').trim());
        if (!Number.isFinite(amount) || amount <= 0) return { ok: false, row: rowNo, message: '金額需為正數' };
        const scheduleType = ['monthly', 'weekly', 'daily', 'yearly'].includes(String(row.scheduleType || '')) ? String(row.scheduleType) : 'monthly';
        const time = String(row.time || '').trim();
        if (!isValidTime(time)) return { ok: false, row: rowNo, message: '時間格式錯誤，請用時間選擇器' };
        if (scheduleType === 'monthly') {
          const day = Number(String(row.day || '').trim());
          if (!Number.isInteger(day) || day < 1 || day > 31) {
            return { ok: false, row: rowNo, message: '每月幾號需填 1-31' };
          }
        }
        if (scheduleType === 'yearly') {
          const month = Number(String(row.month || '').trim());
          const day = Number(String(row.day || '').trim());
          if (!Number.isInteger(month) || month < 1 || month > 12) {
            return { ok: false, row: rowNo, message: '每年月份需填 1-12' };
          }
          if (!Number.isInteger(day) || day < 1 || day > 31) {
            return { ok: false, row: rowNo, message: '每年日期需填 1-31' };
          }
        }
        if (scheduleType === 'weekly') {
          if (!['一', '二', '三', '四', '五', '六', '日'].includes(String(row.weekday || ''))) {
            return { ok: false, row: rowNo, message: '每週星期需選擇正確值' };
          }
        }
        const currency = String(row.currency || '').trim().toUpperCase();
        if (!supportedCurrencies.includes(currency)) {
          return { ok: false, row: rowNo, message: `幣別需從清單選擇（目前不支援 ${currency || '空值'}）` };
        }
        if (!base) return { ok: false, row: rowNo, message: '帳本主幣別設定錯誤' };
      }
      return { ok: true };
    }

    function updateCategoryBudgetValue(encodedTag, value) {
      const tag = decodeURIComponent(encodedTag || '');
      const text = String(value || '').trim().replace(/[,\s]/g, '');
      if (!tag) return;
      if (!text) {
        delete categoryBudgets[tag];
        return;
      }
      const amount = Number(text);
      if (!Number.isFinite(amount) || amount < 0) {
        return;
      }
      if (amount === 0) {
        delete categoryBudgets[tag];
        return;
      }
      categoryBudgets[tag] = Math.round(amount);
    }

    function parseBudgetInput(text) {
      const normalized = String(text || '').replace(/[,\s]/g, '');
      if (!/^\d+$/.test(normalized)) return null;
      const value = Number(normalized);
      if (!Number.isFinite(value) || value < 0) return null;
      return Math.round(value);
    }

    function isValidTime(text) {
      return /^([01]?\d|2[0-3]):([0-5]\d)$/.test(String(text || '').trim());
    }

    function readMealPeriodsFromInputs() {
      const periods = {
        breakfast: {
          start: String(document.getElementById('mealBreakfastStart')?.value || '').trim(),
          end: String(document.getElementById('mealBreakfastEnd')?.value || '').trim(),
        },
        lunch: {
          start: String(document.getElementById('mealLunchStart')?.value || '').trim(),
          end: String(document.getElementById('mealLunchEnd')?.value || '').trim(),
        },
        dinner: {
          start: String(document.getElementById('mealDinnerStart')?.value || '').trim(),
          end: String(document.getElementById('mealDinnerEnd')?.value || '').trim(),
        },
        late_night: {
          start: String(document.getElementById('mealLateNightStart')?.value || '').trim(),
          end: String(document.getElementById('mealLateNightEnd')?.value || '').trim(),
        },
      };

      const labels = {
        breakfast: '早餐',
        lunch: '午餐',
        dinner: '晚餐',
        late_night: '宵夜',
      };
      for (const key of Object.keys(periods)) {
        const start = periods[key].start;
        const end = periods[key].end;
        if (!isValidTime(start) || !isValidTime(end)) {
          return { error: `${labels[key]}時段格式錯誤，請使用 HH:mm` };
        }
      }
      return { value: periods };
    }

    async function saveSettings() {
      if (!channelId) {
        setStatus('儲存失敗：URL 缺少有效的 channelId', true);
        showSaveToast('❌ 儲存失敗：URL 缺少有效的 channelId', 'error');
        return;
      }
      try {
        const budgetRaw = String(document.getElementById('budgetInput')?.value || '').trim();
        const budgetValue = parseBudgetInput(budgetRaw);
        if (budgetValue === null) {
          setStatus('預算格式錯誤：請輸入 0 或正整數（例如 42000）', true);
          return;
        }
        const monthParts = getMonthParts(selectedMonth || getDefaultMonthText()) || getMonthParts(getDefaultMonthText());
        const monthKey = `${monthParts.year}-${String(monthParts.month).padStart(2, '0')}`;
        const monthBudgetRaw = String(document.getElementById('monthBudgetOverrideInput')?.value || '').trim();
        const nextMonthlyBudgets = { ...(monthlyBudgets || {}) };
        if (!monthBudgetRaw) {
          delete nextMonthlyBudgets[monthKey];
        } else {
          const monthBudgetValue = parseBudgetInput(monthBudgetRaw);
          if (monthBudgetValue === null) {
            setStatus(`月份預算格式錯誤：${monthKey} 請輸入 0 或正整數`, true);
            return;
          }
          nextMonthlyBudgets[monthKey] = monthBudgetValue;
        }

        const reminderTime = String(document.getElementById('reminderTimeInput')?.value || '').trim();
        const reminderEnabledEl = document.getElementById('reminderEnabledInput');
        const reminderEnabled = reminderEnabledEl ? reminderEnabledEl.value === 'true' : true;
        if (reminderEnabled && reminderTime && !isValidTime(reminderTime)) {
          setStatus('提醒時間格式錯誤：請使用 HH:mm（例如 21:30）', true);
          return;
        }

        const currencyValue = String(document.getElementById('currencyInput')?.value || 'TWD').trim() || 'TWD';
        if (!/^[A-Za-z]{2,6}$/.test(currencyValue)) {
          setStatus('貨幣格式錯誤：請輸入 2-6 位英文字母（例如 TWD）', true);
          return;
        }

        const mealPeriodsResult = readMealPeriodsFromInputs();
        if (mealPeriodsResult.error) {
          setStatus(mealPeriodsResult.error, true);
          return;
        }

        let categoryRulesPayload = '[]';
        try {
          const rawRules = String(document.getElementById('categoryRulesTextInput')?.value || '').trim() || '[]';
          const parsedRules = JSON.parse(rawRules);
          if (!Array.isArray(parsedRules)) throw new Error('需為陣列');
          categoryRulesPayload = JSON.stringify(parsedRules);
        } catch (e) {
          setStatus(`分類記憶 JSON 錯誤：${e.message}`, true);
          return;
        }

        const payload = {
          budget: budgetValue,
          reminderTime,
          reminderEnabled,
          gender: String(document.getElementById('genderInput')?.value || ''),
          title: String(document.getElementById('titleInput')?.value || '').trim(),
          currency: currencyValue.toUpperCase(),
          showBalanceInName: String(document.getElementById('showBalanceInNameInput')?.value || 'true') === 'true',
          vehicleSyncEnabled: String(document.getElementById('vehicleSyncInput')?.value || 'false') === 'true',
          categoriesText: dedupeTags(getAllCategoryTags()).join('\n'),
          categoryBudgetsText: serializeCategoryBudgets(categoryBudgets),
          mealPeriodsText: serializeMealPeriods(mealPeriodsResult.value),
          monthlyBudgetsText: serializeMonthlyBudgets(nextMonthlyBudgets),
          categoryRulesText: categoryRulesPayload,
          chatStyleTagsText: dedupeTags(styleTags).join('\n'),
          recurringItemsText: recurringRowsToText(recurringRows, currencyValue.toUpperCase()),
        };
        const recurringValidation = validateRecurringRows(recurringRows, currencyValue.toUpperCase());
        if (!recurringValidation.ok) {
          setStatus(`週期收支第 ${recurringValidation.row} 列錯誤：${recurringValidation.message}`, true);
          return;
        }
        const categoryBudgetTotal = Object.values(categoryBudgets || {}).reduce((sum, v) => sum + Number(v || 0), 0);
        if (categoryBudgetTotal > budgetValue) {
          setStatus(`分類預算總和（${categoryBudgetTotal.toLocaleString()}）不可超過每月預算（${budgetValue.toLocaleString()}）`, true);
          return;
        }
        setSaveButtonsLoading(true);
        setStatus('⏳ 設定儲存中，請稍候…', false, 'pending');
        try {
          const res = await fetch(`/api/channel/${channelId}/settings`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || '儲存失敗');
          settingsPanelOpen = false;
          await loadData();
          setStatus('✅ 設定已儲存', false, 'success');
          showSaveToast('✅ 設定已儲存', 'success');
        } catch (error) {
          setStatus(`儲存失敗：${error.message}`, true);
          showSaveToast(`❌ 儲存失敗：${error.message}`, 'error');
        } finally {
          setSaveButtonsLoading(false);
        }
      } catch (error) {
        setSaveButtonsLoading(false);
        setStatus(`儲存失敗：${error?.message || error}`, true);
        showSaveToast(`❌ 儲存失敗：${error?.message || error}`, 'error');
      }
    }

    function toDateInputValue(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return '';
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function toTimeInputValue(timestamp) {
      if (!timestamp) return '00:00';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return '00:00';
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function formatDateTimeText(timestamp) {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      if (Number.isNaN(d.getTime())) return String(timestamp);
      const date = d.toLocaleDateString('zh-TW');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${date} ${hh}:${mm}`;
    }
